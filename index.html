<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ポケモンオープン</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#10192e; --panel:#1b2742; --panel2:#24324f; --text:#f4f6fb; --muted:#9aa6c0;
  --accent:#ffcc33; --danger:#e5484d; --ok:#3ccf7a; --blue:#2f7de1; --hit:#ff8a3d;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  -webkit-tap-highlight-color:transparent}
img{max-width:100%}
button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 18px;background:#3a4a6b;color:#fff;font-weight:700}
button:hover{filter:brightness(1.1)}
button.primary{background:var(--accent);color:#1a1a1a}
button.blue{background:var(--blue)}
button.danger{background:var(--danger)}
button.ghost{background:transparent;border:1px solid #4a5a7c;color:var(--text)}
button.small{padding:6px 12px;font-size:13px;border-radius:8px}
button.big{font-size:22px;padding:16px 36px}
button:disabled,button.done{background:#4a4f5a !important;color:#9aa0aa !important;cursor:not-allowed;filter:none}
input[type=text],input[type=number],textarea,select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #4a5a7c;background:#0d1526;color:var(--text)}
input[type=text],textarea{width:100%}
input[type=number]{width:90px;text-align:right}
h1,h2,h3{margin:0 0 12px}
.muted{color:var(--muted)}
.page{max-width:1100px;margin:0 auto;padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.center{justify-content:center}
.spacer{flex:1}
.card{background:var(--panel);border-radius:14px;padding:16px;margin-bottom:14px}
.note{background:#2c2410;border:1px solid #6b5520;color:#ffe9a8;border-radius:10px;padding:10px 14px;margin-bottom:12px}

/* ===== ヘッダー ===== */
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.topbar .title{font-size:22px;font-weight:900;letter-spacing:.05em;margin-right:6px}
.round-label{background:var(--accent);color:#1a1a1a;border-radius:8px;padding:3px 12px;font-weight:900}
.round-label.practice{background:#7a4dd8;color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#666}
.dot.on{background:var(--ok)}

/* ===== ホスト：ロビー等 ===== */
.lobby{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 0}
.qrbox{display:inline-block;background:#fff;padding:14px;border-radius:12px;line-height:0}
.url{word-break:break-all;font-size:14px;color:var(--muted);margin-top:8px}
.plist{display:flex;flex-direction:column;gap:8px;min-width:280px;max-height:420px;overflow:auto}
.pitem{background:var(--panel2);border-radius:10px;padding:10px 14px;font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
.stage{text-align:center;padding:10px 0}
.stage h2{font-size:30px}
.btnbar{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.timer{font-size:96px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;margin:10px 0}
.timer .unit{font-size:32px;margin-left:6px}
.timer.zero{color:var(--danger)}
.sel-status{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:18px 0;text-align:center}
.sel-status .s{background:var(--panel);border-radius:12px;padding:14px;font-size:22px;font-weight:900}
.sel-status .s .st{font-size:18px;margin-top:6px;color:var(--muted)}
.sel-status .s.ok{background:#174a2e}
.sel-status .s.ok .st{color:#8ff0b6}
.order-list{display:flex;flex-direction:column;gap:12px;align-items:center;margin:20px 0}
.order-item{font-size:40px;font-weight:900;background:var(--panel);border-radius:14px;padding:10px 36px;min-width:420px;animation:pop .35s ease-out}
.order-item .no{color:var(--accent);margin-right:16px}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}

/* ===== ホスト：盤面 ===== */
.turnbar{display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:14px;padding:10px 14px;margin-bottom:12px;min-height:92px}
.turn-order{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1}
.turn-order .lbl{font-size:13px;color:var(--muted);font-weight:800;width:100%}
.to-item{background:var(--panel2);border-radius:10px;padding:6px 12px;font-size:18px;font-weight:900;display:inline-flex;align-items:center;gap:6px}
.to-item .no{font-size:13px;color:var(--muted)}
.to-item.cur{background:var(--accent);color:#1a1a1a}
.to-item.cur .no{color:#5a4a00}
.to-item.out{opacity:.45;text-decoration:line-through}
.to-arrow{color:var(--muted);font-weight:900}
.turn-now{text-align:center;min-width:300px}
.turn-now .who{font-size:30px;font-weight:900;color:var(--accent)}
.turn-now .who small{font-size:18px;color:var(--text)}
.turn-timer{font-size:54px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.turn-timer.zero{color:var(--danger)}
.reveal{background:#fff;color:#1d1d1f;border-radius:14px;padding:12px 18px;margin-bottom:12px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;animation:pop .3s ease-out}
.reveal .what{font-size:26px;font-weight:900}
.reveal .what .v{display:inline-block;background:#1d1d1f;color:#fff;border-radius:8px;padding:0 10px;margin:0 3px}
.reveal .res{font-size:20px;font-weight:800;flex:1;min-width:300px}
.reveal .res .hit{color:#d9480f}
.reveal .res .miss{color:#868e96}
.reveal .res .out{color:#c92a2a;font-size:24px}
.board-mid{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.ktable{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;flex:1;background:var(--panel);border-radius:12px;padding:8px}
.kc{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:#f4f1e4;color:#1d1d1f;border-radius:5px;font-size:22px;font-weight:900;position:relative}
.kc.blank{background:transparent}
.kc.called{background:#2a3146;color:#59627a}
.kc.just{outline:3px solid var(--hit);animation:blink 1s ease-in-out 3}
@keyframes blink{50%{outline-color:transparent}}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.pbox{background:var(--panel);border-radius:14px;padding:10px 12px;border:3px solid transparent}
.pbox.cur{border-color:var(--accent)}
.pbox.out{opacity:.75}
.pbox.win{border-color:var(--ok)}
.pbox-head{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:900;margin-bottom:8px}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-weight:800;font-size:13px;white-space:nowrap}
.tag.out{background:var(--danger);color:#fff}
.tag.win{background:var(--ok);color:#10301c}
.tag.cur{background:var(--accent);color:#1a1a1a}
.tag.practice{background:#7a4dd8;color:#fff}
.tag.draw{background:#868e96;color:#fff}
.pks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pk{background:var(--panel2);border-radius:10px;padding:8px 6px;text-align:center;min-height:64px;display:flex;flex-direction:column;gap:6px;justify-content:center;position:relative}
.pk .slots{display:flex;gap:3px;justify-content:center}
.pk .slots span{flex:0 1 26px;min-width:0;height:34px;display:flex;align-items:center;justify-content:center;background:#3a4560;color:#c9d2e8;border-radius:5px;font-size:21px;font-weight:900}
.pk .slots span.op{background:#fff;color:#1d1d1f}
.pk .slots span.op.just{background:var(--hit);color:#fff}
.turn-now .bonus-lbl{display:inline-block;background:var(--ok);color:#10301c;border-radius:8px;padding:2px 10px;font-weight:900;font-size:16px;margin-top:2px}
.reveal .res .bonus{color:#2b8a3e;font-size:22px}
.reveal .auto-next{text-align:center;font-weight:800;color:#555;font-size:15px}
.reveal .auto-next b{font-size:30px;color:#1d1d1f;margin-right:2px}
.reveal .auto-next button{margin-top:4px;background:#e3e6ec;color:#1d1d1f}
.pk .nm{font-size:19px;font-weight:900;line-height:1.2;word-break:break-all}
.pk .nm.dim{color:#8790a8}
.pk .letters{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:26px}
.pk .letters span{background:#fff;color:#1d1d1f;border-radius:5px;font-size:17px;font-weight:900;padding:0 5px;line-height:26px}
.pk .letters span.just{background:var(--hit);color:#fff}
.pk.open{background:#5a1f22}
.pk.open .nm{color:#fff}
.pk .stamp{position:absolute;top:4px;right:4px;background:var(--danger);color:#fff;font-size:11px;font-weight:900;border-radius:4px;padding:0 5px}
.pk.flash{animation:flash 1.2s ease-in-out 2}
@keyframes flash{50%{box-shadow:0 0 0 4px var(--hit)}}
.final-banner{text-align:center;border-radius:14px;padding:16px;margin-bottom:12px;background:linear-gradient(135deg,#1e9b53,#3ccf7a)}
.final-banner.practice{background:linear-gradient(135deg,#5b3bb0,#7a4dd8)}
.final-banner.draw{background:linear-gradient(135deg,#495057,#868e96)}
.final-banner .big{font-size:50px;font-weight:900}

/* ===== ルール説明 ===== */
.rule-display{text-align:left;max-width:1100px;margin:20px auto 28px;line-height:1.7;font-size:22px}
.rule-red{color:#c0392b;background:#f0f0f0;border:1px solid #ddd;padding:1px 7px;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.rule-normal{color:#222}
.rule-display, .rule-display *{color:#fff !important}
.rule-display *:not(.rule-red){background-color:transparent !important}
.rule-display .rule-red, .rule-display .rule-red *{color:#e5342b !important}
.rule-display .rule-red{background:#fff !important;border:none}
.rule-display [style*="font-size"]:not([style*="1.5em"]), .rule-display font[size]{font-size:inherit !important}
.rule-display h1, .rule-display h2, .rule-display h3, .rule-display h4, .rule-display p{font-size:inherit !important;margin:0;font-weight:inherit}
.rule-img{border-radius:8px;margin-bottom:10px;cursor:zoom-in;max-height:50vh}

/* ===== 参加者（スマホ） ===== */
body.sub .page{max-width:520px;padding:10px}
.sub-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:8px}
.role-banner{border-radius:10px;padding:8px 10px;text-align:center;font-size:20px;font-weight:900;margin-bottom:10px;background:var(--accent);color:#1a1a1a}
.role-banner.wait{background:var(--panel2);color:var(--text);font-size:17px}
.role-banner.out{background:var(--danger);color:#fff}
.p-center{text-align:center;padding:30px 16px}
.p-timer{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;text-align:center;margin:6px 0 10px}
.p-timer.zero{color:var(--danger)}
.mypk{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.mypk .m{background:var(--panel);border-radius:10px;padding:8px 4px;text-align:center}
.mypk .m .nm{font-size:16px;font-weight:900;word-break:break-all;margin-bottom:4px}
.mypk .m{position:relative}
.mypk .m.opened{background:#2a2030;opacity:.55}
.mypk .m.opened .nm{text-decoration:line-through;color:#c9c0d0}
.mypk .m .ostamp{display:inline-block;background:var(--danger);color:#fff;font-size:11px;font-weight:900;border-radius:4px;padding:0 6px;margin-bottom:3px}
.deal{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.deal .d{background:var(--panel);border-radius:12px;padding:14px 6px;text-align:center;border:3px solid transparent;cursor:pointer;user-select:none;position:relative}
.deal .d .nm{font-size:19px;font-weight:900;margin-bottom:6px;word-break:break-all}
.deal .d.on{border-color:var(--accent);background:#3a3417}
.deal .d .ck{position:absolute;top:4px;left:6px;font-size:14px;font-weight:900;color:var(--accent)}
.deal.locked .d{cursor:default}
.deal.locked .d:not(.on){opacity:.35}
.ans-box{background:var(--panel);border-radius:12px;padding:12px;margin-bottom:10px}
.ans-box .lbl{font-size:14px;color:var(--muted);font-weight:800;margin-bottom:6px}
.ans-box select{width:100%;font-size:18px;font-weight:900;padding:8px}
.ans-sels{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ans-or{text-align:center;font-weight:900;color:var(--muted);margin:10px 0}
.ans-pick{text-align:center;font-size:18px;font-weight:900;margin:10px 0;min-height:28px}
.ans-pick .v{display:inline-block;background:var(--accent);color:#1a1a1a;border-radius:6px;padding:0 10px;margin:0 2px}
.ans-box input[type=text]{font-size:22px;font-weight:900;text-align:center;letter-spacing:.1em}
.ans-box select.own,.ans-box input.own{background:#7a1d22;border-color:#ff6b6b;color:#fff}
.ans-box option.own{background:#7a1d22;color:#fff}
.ans-pick .v.own{background:#e5484d;color:#fff}
.ans-err{color:#ff8a8e;font-weight:800;font-size:14px;min-height:18px;margin-top:4px;text-align:center}
.own-warn{color:#ff8a8e;font-size:14px;margin-top:4px}
.own-note{background:#7a1d22;color:#fff;border-radius:4px;padding:0 5px}
.mode-box{display:inline-flex;flex-direction:column;gap:10px;background:var(--panel2);border-radius:12px;padding:12px 20px;margin-top:10px;text-align:left}
.mode-box select{font-size:16px;font-weight:800}
.genchk{display:inline-flex;align-items:center;gap:3px;margin-right:8px;font-weight:800;cursor:pointer}
.iimg{display:inline-flex;align-items:center;justify-content:center;object-fit:contain;vertical-align:middle;flex:none}
.iimg.q{background:#3a4560;color:#c9d2e8;border-radius:8px;font-weight:900}
.ibadge{display:inline-flex;align-items:center;gap:6px;background:#3a4560;color:#c9d2e8;border-radius:8px;padding:2px 10px 2px 3px;font-size:14px;font-weight:800}
.ibadge .iimg.q{background:#2a3146}
.ibadge.on{background:#ffd43b;color:#1a1a1a;position:relative;cursor:pointer}
.ibadge .itip{display:none;position:absolute;right:0;bottom:calc(100% + 8px);width:320px;z-index:40;background:#fff;color:#1d1d1f;border-radius:10px;padding:8px 12px;font-size:15px;font-weight:600;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.45);text-align:left;white-space:normal}
.ibadge .itip b{display:block;font-size:16px;color:#b8860b;margin-bottom:2px}
.ibadge .itip::after{content:"";position:absolute;right:24px;top:100%;border:8px solid transparent;border-top-color:#fff}
.ibadge.on:hover .itip,.ibadge.show-tip .itip{display:block}
.tag.endure{background:#9775fa;color:#fff}
.reveal .iev{font-size:19px;color:#1d1d1f;margin-top:4px;animation:pop .3s ease-out}
.reveal .iev.out{color:#c92a2a;font-size:22px}
.pk .rd{font-size:13px;color:#ffd8d8}
.mypk .m .rd,.deal .d .rd{font-size:12px;color:var(--muted)}
.sitem{background:var(--panel);border:1px solid #6b5520;border-radius:10px;padding:8px 10px;margin:-4px 0 10px;font-size:13px;line-height:1.5}
.sitem b{color:var(--accent);font-size:15px}
.item-list .iopen{font-size:12px;color:#7a5c00;margin-top:3px}
.idesc-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.idesc-row textarea{margin-top:4px;font-size:14px;line-height:1.5}
.sitem.has-img{display:flex;gap:10px;align-items:flex-start}
.sitem.none{border-color:#33415f;color:var(--muted)}
.ditem{margin-top:6px;font-size:13px;font-weight:800;color:var(--accent)}
.ditem small{display:block;font-weight:500;color:var(--text);font-size:11px;line-height:1.4;margin-top:2px;text-align:left}
.item-list{max-height:60vh;overflow:auto;display:flex;flex-direction:column;gap:8px;text-align:left}
.item-list .it{display:flex;gap:10px;align-items:flex-start;background:#f3f4f7;color:#1d1d1f;border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.5}
.bottom-btns{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.bottom-btns button{padding:14px;font-size:17px}
.spinner{width:40px;height:40px;border:4px solid #3a4a6b;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== モーダル・トースト ===== */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;color:#1d1d1f;border-radius:14px;padding:20px;max-width:460px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.modal p{margin:6px 0}
.modal .warn{background:#fff0e6;border:2px solid #ff8a3d;border-radius:10px;padding:10px;font-weight:800;color:#b03b00}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.modal button{background:#e3e6ec;color:#1d1d1f}
.modal button.primary{background:var(--accent)}
.modal button.danger{background:var(--danger);color:#fff}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:15px;cursor:pointer}
.chk input{margin-top:3px;transform:scale(1.2)}
.img-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:150}
.img-modal img{max-width:92vw;max-height:92vh}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:200;pointer-events:none;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw}
.toast{background:#222c44;color:#fff;border-radius:12px;padding:10px 18px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:tin .2s ease-out;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* ===== 保存オーバーレイ ===== */
.save-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:300}
.save-overlay.active{display:flex}
.save-box{background:#fff;color:#222;padding:24px 30px;border-radius:12px;text-align:center;min-width:260px}
.save-box .spinner{border-color:#ddd;border-top-color:#e0a800}
.save-bar-outer{background:#eee;border-radius:6px;height:10px;margin-top:10px;overflow:hidden}
.save-bar-inner{background:#e0a800;height:100%;width:0%;transition:width .2s}

/* ===== 管理 ===== */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid #33415f;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:700;white-space:nowrap}
.table-wrap{overflow-x:auto}
.ex-list{display:flex;flex-wrap:wrap;gap:8px}
.ex-item{background:var(--panel2);border-radius:8px;padding:6px 8px 6px 12px;display:inline-flex;align-items:center;gap:8px;font-weight:700}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--panel2);border-radius:12px;padding:12px 14px;text-align:center}
.stat .lbl{font-size:15px;color:var(--muted);font-weight:700}
.stat .val{font-size:40px;font-weight:900}
.set-grid{display:grid;grid-template-columns:200px 1fr;gap:12px 16px;align-items:center}
.set-grid>.lbl{font-weight:800}
.err-text{color:#ff8a8e;font-weight:700;font-size:14px}
.sticky-actions{position:sticky;bottom:0;background:var(--bg);padding:10px 0;z-index:5;border-top:1px solid #2a3654}
.rich-toolbar{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.rich-toolbar button{padding:4px 10px;font-size:13px;border-radius:6px}
.rule-edit{border:1px solid #ccc;border-radius:6px;min-height:70px;padding:10px;background:#fff;color:#222;text-align:left;line-height:1.6}
.rule-slide-card{border:1px solid #33415f;border-radius:10px;padding:10px;margin-bottom:10px;background:#16213a}
.rule-group-block{margin-bottom:10px}

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function stripHtml(h){ return String(h||'').replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').trim(); }
function toInt(v){ const s=String(v==null?'':v).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).trim(); return /^-?\d+$/.test(s) ? parseInt(s,10) : NaN; }

function openModal(html, buttons){
  const wrap=document.createElement('div');
  wrap.className='modal-bg';
  wrap.innerHTML=`<div class="modal">${html}<div class="modal-btns"></div></div>`;
  const close=()=>wrap.remove();
  (buttons||[{label:'閉じる'}]).forEach(b=>{
    const el=document.createElement('button');
    el.textContent=b.label; if(b.cls) el.className=b.cls;
    el.onclick=()=>{ if(b.onClick && b.onClick()===false) return; close(); };
    wrap.querySelector('.modal-btns').appendChild(el);
  });
  document.getElementById('modal-root').appendChild(wrap);
  return {el:wrap, close};
}

/* ---------- 判定 ---------- */
/** その文字がオープンされているか（文字表にない文字は最初からオープン扱い） */
function charOpen(c, chars){ return !TABLE_SET.has(c) || chars.includes(c); }
/** 名前がすべてオープンされたか */
function nameOpen(name, chars){ return [...name].every(c=>charOpen(c, chars)); }
/** オープンされた文字（名前の中の順・同じ文字は1回だけ） */
function openedLetters(name, chars){ const seen=new Set(), out=[]; [...name].forEach(c=>{ if(TABLE_SET.has(c) && chars.includes(c) && !seen.has(c)){ seen.add(c); out.push(c); } }); return out; }
function pkHas(pk, v){ return pk.n.includes(v); }
/** 入力した文字を文字表の文字にそろえる（ひらがな→カタカナ・半角の記号や数字→全角） */
function normalizeKana(str){
  return [...String(str||'').normalize('NFKC')].map(c=>{   // NFKC：半角カナ→全角カナ（数字・英字・記号は半角になるので下で全角に戻す）
    const code=c.charCodeAt(0);
    if(TABLE_KIND==='yoji'){ if(code>=0x30A1 && code<=0x30F6) return String.fromCharCode(code-0x60); return /\s/.test(c)?'':c; }
    if(code>=0x3041 && code<=0x3096) return String.fromCharCode(code+0x60);
    if('-－―‐ｰ〜~'.includes(c)) return 'ー';
    if(c==='2') return '２';
    if(c==='z'||c==='Z'||c==='ｚ') return 'Ｚ';
    if(c===':') return '：';
    if(c==='･'||c==='/') return '・';
    if(/\s/.test(c)) return '';
    return c;
  }).join('');
}
/** 解答欄の文字を読み取る。{chars, err} */
function parseAnswerText(str, max, called, allowed){
  const raw=[...normalizeKana(str)], chars=[], al=new Set(allowed||TABLE_CHARS);
  for(const c of raw){
    if(!al.has(c)) return {chars:[], err:`「${c}」は文字表にない文字です`};
    if(called.includes(c)) return {chars:[], err:`「${c}」はもう選ばれています`};
    if(!chars.includes(c)) chars.push(c);
  }
  if(chars.length>max) return {chars:[], err:`${max}文字までです`};
  return {chars, err:''};
}

/** 道具の画像。k が無い（まだ「？」）ときは「？」の枠 */
function itemImg(k, size){ const z=size||40; return k && ITEM_IMG[k] ? `<img class="iimg" src="${ITEM_IMG[k]}" alt="" style="width:${z}px;height:${z}px">` : `<span class="iimg q" style="width:${z}px;height:${z}px;font-size:${Math.round(z*0.6)}px">？</span>`; }
const ITEM_NOTE = '道具の効果で開いた文字では、ほかの道具は発動しません。道具の効果で開いても、正解後のもう1回はありません。';
function itemName(k){ return ITEMS[k] ? ITEMS[k].name : ''; }
/** 説明文のもと（管理ページで書き換えたものがあればそれ） */
function itemDescTemplate(k){ const c=appData.itemDescs && appData.itemDescs[k]; return (c && c.trim()) ? c.trim() : (ITEMS[k] ? ITEMS[k].desc : ''); }
/** n＝このゲームの参加人数（ゲーム前は省略 → 「参加人数＋1」と表記） */
function inochiMax(n, s){ s=s||(typeof gs!=='undefined'&&gs&&gs.settings)||appData.settings; return n ? n+(s.inochiAdd||0) : null; }
function itemDesc(k, s, kind, n){
  s=s||appData.settings;
  const t=itemDescTemplate(k).replace(/\{確率\}/g, ITEM_PCT[k] ? String(s[ITEM_PCT[k]]) : '')
    .replace(/\{最後確率\}/g, String(s.pFocusLast))
    .replace(/\{文字数\}/g, n ? String(inochiMax(n, s)) : `（参加人数${s.inochiAdd?'＋'+s.inochiAdd:''}）`);
  return kind==='yoji' ? t.replace(/ポケモンの名前/g,'四字熟語の読み').replace(/ポケモン/g,'四字熟語') : t;
}
/** 道具一覧（ポップアップ用） */
function itemListHtml(s, kind){
  return `<div class="item-list">${ITEM_KEYS.map((k,i)=>`<div class="it">${itemImg(k,44)}<div><b>${i+1}. ${esc(itemName(k))}</b><div>${esc(itemDesc(k, s, kind))}</div><div class="iopen">公開：${esc(ITEM_OPEN[k])}</div></div></div>`).join('')}</div>

}

/** [名前, 世代] → {n, g}。世代が分からないものは g=0（世代の絞り込みに関係なく使う） */
function toPk(a){ const g=toInt(a[a.length-1]), n=String(a[0]||'').trim(); return { n, d:n, k:n, g: a.length>1 && !isNaN(g) ? g : 0 }; }
/** 四字熟語：n＝読み（ひらがな・この文字で当てる）／d＝四字熟語 */
function getYojiList(){ return DEFAULT_YOJI.map(([d,n])=>({ n, d, k:'四:'+d, g:0 })); }
function getWordList(kind){ return kind==='yoji' ? getYojiList() : getItemList(); }
/** 表示用の名前（四字熟語は「漢字（よみ）」） */
function pkLabel(pk){ return pk.d && pk.d!==pk.n ? `${pk.d}（${pk.n}）` : pk.n; }
function allGens(){ return [...new Set(getItemList().map(p=>p.g).filter(x=>x>0))].sort((a,b)=>a-b); }
function genFilter(gens){ const set=new Set(gens||[]); return p=>!p.g || set.has(p.g); }
function getItemList(){
  const w=lsGet(LS.items, null);
  const list = Array.isArray(w)&&w.length ? w : DEFAULT_ITEMS;
  const seen=new Set(), out=[];
  list.forEach(a=>{ if(!Array.isArray(a)) return; const p=toPk(a); if(!p.n || seen.has(p.n)) return; seen.add(p.n); out.push(p); });
  return out;
}
function getUsed(){ return new Set(lsGet(LS.used, [])); }
function setUsed(s){ lsSet(LS.used, [...s]); }
function getExcluded(){ return new Set(lsGet(LS.excluded, [])); }
function setExcluded(s){ lsSet(LS.excluded, [...s]); }
function getHistory(){ return lsGet(LS.history, []); }
function setHistory(h){ lsSet(LS.history, h); }
function availablePool(skip, filter, kind){
  const used=getUsed(), ex=getExcluded(), sk=new Set(skip||[]), f=filter||(()=>true);
  return getWordList(kind).filter(p=>f(p) && !used.has(p.k) && !ex.has(p.k) && !sk.has(p.k));
}
function usableCount(filter, kind){ const ex=getExcluded(), f=filter||(()=>true); return getWordList(kind).filter(p=>f(p) && !ex.has(p.k)).length; }
/** n匹を重複なしで選んで使用済みにする（足りない時は使用状況のリセットを確認）。filter＝対象の世代。キャンセル時は null */
function pickItems(n, filter, kind){
  const L=wordLabel(kind);
  let pool=availablePool([], filter, kind), first=[];
  if(pool.length<n){
    if(usableCount(filter, kind) < n){ alert(`${L}が足りません（${n}個必要・除外を除いて${usableCount(filter, kind)}個）。${kind==='yoji'?'':'対象の世代を増やすか、'}管理ページで除外リストを確認してください。`); return null; }
    if(!confirm(`未使用の${L}が残り${pool.length}個しかありません（${n}個必要）。\n${L}の使用状況をリセットしますか？\n（残りを先に使い、足りない分をリセット後から選びます）`)) return null;
    first=shuffle(pool);
    const all=new Set(getWordList(kind).map(x=>x.k)), u=getUsed();   // この種類（ポケモン／四字熟語）の分だけリセット
    setUsed(new Set([...u].filter(k=>!all.has(k))));
    pool=availablePool(first.map(p=>p.k), filter, kind);
  }
  const picked=first.concat(shuffle(pool).slice(0, n-first.length));
  const used=getUsed(); picked.forEach(p=>used.add(p.k)); setUsed(used);
  return shuffle(picked);
}

    const g=G();

    if(g && gs.phase==='turn' && g.turn){ g.turn.endsAt=Date.now()+g.turn.durMs; }

    if(id==='opt-set') gs.opt.set=e.target.value;
    if(id==='opt-deal') gs.opt.deal=e.target.value;
    if(id==='opt-two') gs.opt.two=e.target.checked;

function startPeer(roomId, retry){
  const id=roomId||genRoomId();
  if(peer){ try{ peer.destroy(); }catch(e){} }
  peer=new Peer(id);
  peer.on('open', pid=>{ myHostId=pid; lsSet(LS.room, pid); saveState(); renderHost(); });
  peer.on('connection', conn=>{
    conn.on('data', data=>handleSubMessage(conn, data));
    conn.on('close', ()=>{
      const pid=conn._pid;
      if(pid && conns[pid]===conn){ delete conns[pid]; connected.delete(pid); renderHost(); }
    });
  });
  peer.on('error', err=>{
    if(err && err.type==='unavailable-id'){
      if(roomId && retry<5){ setTimeout(()=>startPeer(roomId, retry+1), 3000); }
      else { showToast('部屋番号を新しくしました。スマホはQRから入り直してください', 5000); startPeer(null, 0); }
    } else { console.error(err); }
  });
  peer.on('disconnected', ()=>{ try{ peer.reconnect(); }catch(e){} });
}
function saveState(){ lsSet(LS.state, gs); }
function commit(){ saveState(); syncAll(); renderHost(); }
function sendTo(pid, msg){ const c=conns[pid]; if(c && c.open){ try{ c.send(msg); }catch(e){} } }
function syncAll(){ Object.keys(conns).forEach(pid=>sendTo(pid, snapshotFor(pid))); }

/** 参加者に送る画面情報（参加者は毎回これで上書きするだけ） */
function snapshotFor(pid){
  const g=G(), ph=gs.phase;
  const snap={ type:'state', title:GAME_TITLE, phase:ph, name:pname(pid), member:false, gameId:null };
  if(!g || ph==='lobby' || ph==='rule') return snap;
  snap.wordSet=g.wordSet||'poke';
  const h=g.hands[pid];
  Object.assign(snap, { gameId:g.id, label:g.label, practice:g.practice, member:!!h,
    calledChars:g.called.chars, keepN:gKeep(g), maxChars:gMaxChars(g), allowedChars:gAllowed(g), items:!!g.items,
    itemInfo: g.items ? ITEM_KEYS.reduce((o,k)=>(o[k]={name:itemName(k), desc:itemDesc(k, S(), g.wordSet, g.members.length)},o), {}) : null,
    orderNames: ph==='select' ? [] : g.turnOrder.map(pname) });
  if(h){
    snap.out=g.out.includes(pid);
    if(ph==='select'){ snap.deal=h.deal; snap.picks=h.picks; snap.confirmed=h.confirmed; snap.remainingMs=Math.max(0,g.selEndsAt-Date.now()); }
    else {
      snap.mine=h.final;
      snap.enduring=!!h.endure;
      // みとおしメガネ：ほかの人のポケモンの文字数
      if(g.items && itemOf(g, pid)==='megane') snap.megane=g.turnOrder.filter(q=>q!==pid).map(q=>({name:pname(q), len:[...g.hands[q].final[0].n].length, out:g.out.includes(q)}));
    }
  }
  if(ph==='turn' && g.turn){
    snap.turn={ id:g.turn.id, name:pname(g.turn.pid), isMe:g.turn.pid===pid, bonus:!!g.turn.bonus, maxChars:turnMax(g), focus:!!g.turn.focus, remainingMs:Math.max(0,g.turn.endsAt-Date.now()) };
  }
  if(ph==='reveal' && g.lastResult) snap.lastName=g.lastResult.name;
  if(ph==='end') snap.result={ draw:g.draw, winnerNames:g.winners.map(pname), practice:g.practice };
  return snap;
}
function remapPid(oldP, newP){
  gs.order=gs.order.map(p=>p===oldP?newP:p);
  const g=G(); if(!g) return;
  if(g.hands[oldP]){ g.hands[newP]=g.hands[oldP]; delete g.hands[oldP]; }
  g.members=g.members.map(p=>p===oldP?newP:p);
  g.turnOrder=g.turnOrder.map(p=>p===oldP?newP:p);
  g.out=g.out.map(p=>p===oldP?newP:p);
  g.winners=g.winners.map(p=>p===oldP?newP:p);
  if(g.turn && g.turn.pid===oldP) g.turn.pid=newP;
  if(g.lastResult && g.lastResult.pid===oldP) g.lastResult.pid=newP;
  if(g.focusLast===oldP) g.focusLast=newP;
  g.members.forEach(p=>{ const e=g.hands[p].endure; if(e) e.left=e.left.map(q=>q===oldP?newP:q); });
}
function handleSubMessage(conn, data){
  if(!data || !data.type) return;
  if(data.type==='join'){
    let pid=String(data.pid||''); const name=String(data.name||'').trim().slice(0,12);
    if(!pid || !name) return;
    if(!gs.players[pid]){
      // タブを閉じて入り直した人：同じニックネームで切断中の人がいれば、その人として復帰
      const same=gs.order.find(p=>gs.players[p] && gs.players[p].name===name);
      if(same && !connected.has(same)){
        gs.players[pid]=gs.players[same]; delete gs.players[same];
        remapPid(same, pid);
      } else if(same){ try{ conn.send({type:'name_taken'}); }catch(e){} return; }
      else { gs.players[pid]={name}; gs.order.push(pid); }
    } else {
      if(gs.order.some(p=>p!==pid && gs.players[p] && gs.players[p].name===name)){ try{ conn.send({type:'name_taken'}); }catch(e){} return; }
      gs.players[pid].name=name;
    }
    const old=conns[pid];
    conn._pid=pid; conns[pid]=conn; connected.add(pid);
    if(old && old!==conn){ try{ old.close(); }catch(e){} }
    commit();
    return;
  }
  const pid=conn._pid; if(!pid || !gs.players[pid]) return;
  const g=G();
  if(data.type==='pick'){
    if(gs.phase!=='select' || !g || data.gameId!==g.id) return;
    const h=g.hands[pid]; if(!h || h.confirmed) return;
    const picks=[...new Set((data.picks||[]).map(Number))].filter(i=>i>=0 && i<h.deal.length).slice(0,gKeep(g));
    h.picks=picks;
    if(data.confirm && picks.length===gKeep(g)){ h.confirmed=true; h.final=picks.map(i=>h.deal[i]); }
    if(g.members.every(p=>g.hands[p].confirmed)) finishSelect();
    else commit();
    return;
  }
  if(data.type==='answer'){
    if(gs.phase!=='turn' || !g || !g.turn || g.turn.pid!==pid || data.turnId!==g.turn.id) return;
    let vals=[...new Set((data.vals||[]).map(String))];
    vals=vals.filter(v=>gAllowed(g).includes(v) && !g.called.chars.includes(v)).slice(0, turnMax(g));   // 正解後のもう1回は文字1つ
    if(!vals.length){ sendTo(pid,{type:'toast', text:'その回答は選べません。選び直してください'}); return; }
    applyAnswer(vals);
  }
}

function beginGame(practice, withRule){
  if(connectedPids().length<MIN_PLAYERS){ alert(`参加者が${MIN_PLAYERS}人以上必要です`); return; }
  if(gs.opt.set!=='yoji' && !(gs.opt.gens||[]).length){ alert('対象の世代を1つ以上選んでください'); return; }
  loadAppData().then(()=>{
    gs.settings=JSON.parse(JSON.stringify(appData.settings));   // ゲーム中は開始時点の設定で固定
    const hasRule=appData.ruleSlides.some(s=>s.img || s.groups.some(g=>stripHtml(g)));
    if(withRule && hasRule){ gs.pendingPractice=practice; gs.game=null; gs.phase='rule'; gs.ruleSlideIndex=0; gs.ruleRevealIndex=0; commit(); }
    else dealGame(practice);
  });
}
/** モードの数ずつ配る（6匹 or 3匹・参加者どうしで重複なし・対象の世代だけ）→ ポケモン選択へ */
function dealGame(practice){
  const members=connectedPids();
  if(members.length<MIN_PLAYERS){ alert(`接続中の参加者が${MIN_PLAYERS}人以上必要です`); return false; }
  const opt=gs.opt||loadOpt(), kind=opt.set==='yoji'?'yoji':'poke';
  const mode = kind==='yoji' ? DEAL_MODES['3-1'] : (DEAL_MODES[opt.deal]||DEAL_MODES['6-3']), dn=mode.deal;   // 四字熟語は3つから1つだけ
  if(kind==='poke' && !(opt.gens||[]).length){ alert('対象の世代を1つ以上選んでください'); return false; }
  const filter = kind==='poke' ? genFilter(opt.gens) : null;
  useTable(kind);
  const items=pickItems(members.length*dn, filter, kind);
  if(!items) return false;
  const withItems = mode.keep===1 && !!opt.items;
  const rate=S().itemRate;
  const hands={};
  members.forEach((p,i)=>{
    const usedItems=new Set();
    // 1人に配る3匹の道具は、それぞれ違うもの（ほかの人とはかぶってもよい）
    const deal=items.slice(i*dn,(i+1)*dn).map(pk=>{
      const d={n:pk.n, d:pk.d, k:pk.k, g:pk.g, item:null};
      if(withItems && Math.random()*100 < rate){
        const cand=ITEM_KEYS.filter(k=>!usedItems.has(k));
        if(cand.length){ d.item=cand[Math.floor(Math.random()*cand.length)]; usedItems.add(d.item); }
      }
      return d;
    });
    hands[p]={ deal, picks:[], confirmed:false, final:null };
  });
  // 盤面に出す文字＝対象の世代のポケモン（除外を除く）に出てくる文字だけ。四字熟語は文字表そのまま（読みにない文字は最初から空欄）
  const ex=getExcluded(), present=new Set();
  if(kind==='poke') getItemList().filter(pk=>filter(pk) && !ex.has(pk.k)).forEach(pk=>[...pk.n].forEach(c=>present.add(c)));
  const allowed = kind==='poke' ? TABLE_CHARS.filter(c=>present.has(c)) : TABLE_CHARS.slice();
  gs.game={ id:uid(), practice, label:nextLabel(practice), members, hands,
            wordSet:kind, dealMode: kind==='yoji' ? '3-1' : opt.deal, dealN:dn, keepN:mode.keep, maxChars:opt.two?2:1, items:withItems, gens:opt.gens.slice(), allowed,
            selEndsAt:Date.now()+S().selectSec*1000,
            turnOrder:[], orderShown:0, turnIdx:0, turn:null, turnSeq:0, focusLast:null,
            called:{chars:[]}, log:[], lastResult:null, out:[], winners:[], draw:false,
            words:items.map(p=>p.k), startedAt:Date.now() };
  gs.phase='select';
  commit();
  return true;
}
function advanceRule(){
  const slides=appData.ruleSlides, slide=slides[gs.ruleSlideIndex];
  if(gs.ruleRevealIndex < slide.groups.length-1){ gs.ruleRevealIndex++; commit(); }
  else if(gs.ruleSlideIndex < slides.length-1){ gs.ruleSlideIndex++; gs.ruleRevealIndex=0; commit(); }
  else dealGame(gs.pendingPractice);
}
function retreatRule(){
  const slides=appData.ruleSlides;
  if(gs.ruleRevealIndex>0) gs.ruleRevealIndex--;
  else if(gs.ruleSlideIndex>0){ gs.ruleSlideIndex--; gs.ruleRevealIndex=slides[gs.ruleSlideIndex].groups.length-1; }
  commit();
}
/** 選択終了：確定していない人は、選んでいる分はそのまま・足りない分を残りからランダムで選ぶ → 回答順の発表へ */
function finishSelect(){
  const g=G(); if(!g || gs.phase!=='select') return;
  g.members.forEach(p=>{
    const h=g.hands[p]; if(h.confirmed) return;
    const rest=shuffle([...Array(h.deal.length).keys()].filter(i=>!h.picks.includes(i)));
    h.picks=h.picks.concat(rest.slice(0, gKeep(g)-h.picks.length));
    h.final=h.picks.map(i=>h.deal[i]); h.confirmed=true; h.auto=true;
  });
  g.turnOrder=decideOrder(g);
  g.orderShown=0;
  gs.phase='order';
  commit();
  playOrderAnim();
}
/** 回答順：せんせいのツメを持っている人は、1番になる重みが＋○%（足し算）。2番目以降はランダム */
function decideOrder(g){
  const all=g.members;
  // フォーカスレンズ：○%の確率で一番最後になる（先に決める。外れたらふつうのランダム）
  const fl=shuffle(all.filter(p=>itemOf(g,p)==='focus')).find(()=>roll(S().pFocusLast));
  const ms=all.filter(p=>p!==fl);
  // せんせいのツメ：○%の確率で1番になる（外れたらふつうのランダム。2人以上持っていたら順番に判定）
  const first=shuffle(ms.filter(p=>itemOf(g,p)==='tsume')).find(()=>roll(S().pTsume)) || pickOne(ms);
  const order=[first].concat(shuffle(ms.filter(p=>p!==first && p!==fl)), fl ? [fl] : []);
  if(itemOf(g, first)==='tsume') revealNow(g, first);   // ツメ：持ち主が1番になったときだけ公開
  g.focusLast=order[order.length-1];
  const meganes=all.filter(p=>itemOf(g,p)==='megane');   // みとおしメガネ：ゲーム開始時に公開
  meganes.forEach(p=>revealNow(g,p));
  if(g.items) g.orderNote = [itemOf(g, first)==='tsume' ? `✨ ${pname(first)}さんの「せんせいのツメ」！` : '',
    meganes.length ? `👓 ${meganes.map(pname).join('さん・')}さんは「みとおしメガネ」を持っています` : ''].filter(Boolean).join('　');
  return order;
}
function playOrderAnim(){
  clearInterval(orderAnimTimer);
  orderAnimTimer=setInterval(()=>{
    const g=G();
    if(!g || gs.phase!=='order' || g.orderShown>=g.turnOrder.length){ clearInterval(orderAnimTimer); orderAnimTimer=null; return; }
    g.orderShown++; commit();
  }, 900);
}

/* ----- 道具まわりの道具（関数） ----- */
function itemOf(g, p){ const h=g && g.items && g.hands[p]; return h && h.final && h.final[0] ? h.final[0].item||null : null; }
function namesOf(g, p){ return (g.hands[p].final||[]).map(pk=>pk.n); }
function isOut(g, p){ return g.out.includes(p); }
function livingOthers(g, p){ return g.turnOrder.filter(q=>q!==p && !isOut(g,q)); }
/** 開いていないマスの数 */
/** 開いているマスの数（文字数が分からないように、開いた方で比べる） */
function openedSlots(g, p){ return namesOf(g,p).reduce((a,n)=>a+[...n].filter(c=>TABLE_SET.has(c) && g.called.chars.includes(c)).length, 0); }
function remainingSlots(g, p){ return namesOf(g,p).reduce((a,n)=>a+[...n].filter(c=>!charOpen(c, g.called.chars)).length, 0); }
function fullyOpen(g, p){ return namesOf(g,p).every(n=>nameOpen(n, g.called.chars)); }
/** その人のポケモンで、まだ開いていない文字（1種類ずつ）。exceptPid のポケモンにある文字は除く */
function unopenedLetters(g, p, exceptPid){
  const ng=new Set(exceptPid ? namesOf(g,exceptPid).join('') : '');
  return [...new Set(namesOf(g,p).join(''))].filter(c=>TABLE_SET.has(c) && !g.called.chars.includes(c) && !ng.has(c));
}
function pickOne(a){ return a.length ? a[Math.floor(Math.random()*a.length)] : null; }
function roll(pct){ return Math.random()*100 < pct; }
/** 道具を公開する。ホスト画面では、その効果の表示が出たときに「？」から道具名に変わる */
function reveal(g, p){ if(g.hands[p].revealed) return; g.hands[p].revealed=true; (g.revealQueue=g.revealQueue||[]).push(p); }
/** 効果の表示（結果）を待たずに、すぐ公開する（回答順の発表・ターン開始のときの公開） */
function revealNow(g, p){ g.hands[p].revealed=true; }
/** 文字を開く（道具で開いても回答で開いても、文字表もグレーになり全員のポケモンで開く） */
function openLetter(g, c){ if(c && !g.called.chars.includes(c)) g.called.chars.push(c); }
function ev(events, text, letters, cls){ const g=G(); events.push({ text, letters:letters||[], cls:cls||'', reveals:(g && g.revealQueue||[]).splice(0) }); }

/** メンタルハーブ：選ばれた文字が、ハーブを持つ人のまだ開いていない文字にもあれば（巻き込みでも）その人を返す */
function herbBlocker(g, c, exceptPid){
  return g.turnOrder.find(q=>q!==exceptPid && !isOut(g,q) && itemOf(g,q)==='herb' && namesOf(g,q).some(n=>n.includes(c)));
}
/**
 * 道具の効果で target の文字を1種類開く（source＝効果を起こした人。exceptSource＝source のポケモンにある文字は選ばない）
 * メンタルハーブ：狙われたとき・巻き込まれるとき、効果ごと取り消し（誰の文字も開かない）
 */
function itemOpen(g, source, srcItem, target, exceptSource, events){
  const tag=`${pname(source)}さんの「${itemName(srcItem)}」`;
  if(itemOf(g, target)==='herb'){ reveal(g, target); ev(events, `🛡 ${tag} → ${pname(target)}さんの「メンタルハーブ」で取り消し！`); return null; }
  const c=pickOne(unopenedLetters(g, target, exceptSource ? source : null));
  if(!c){ ev(events, `${tag}：${pname(target)}さんに開ける文字がなかった`); return null; }
  const hb=herbBlocker(g, c, null);
  if(hb){ reveal(g, hb); ev(events, `🛡 ${tag}で「${c}」が開きそうになったが、${pname(hb)}さんの「メンタルハーブ」で取り消し！`); return null; }
  openLetter(g, c);
  ev(events, `✨ ${tag}が発動！ ${pname(target)}さんの文字「${c}」がオープン`, [c]);
  return c;
}
/** 名前が全部開いた人を負けにする（きあいのハチマキは1回だけ判定）。新しく負けた人を返す */
function processOuts(g, events){
  const newOut=[];
  g.turnOrder.forEach(p=>{
    const h=g.hands[p];
    if(isOut(g,p) || h.endure || !fullyOpen(g,p)) return;
    if(itemOf(g,p)==='kiai' && !h.kiaiUsed){
      h.kiaiUsed=true;
      if(roll(S().pKiai)){
        reveal(g,p);
        h.endure={ seq:g.turnSeq, left:g.turnOrder.filter(q=>!isOut(g,q)) };
        ev(events, `💪 ${pname(p)}さんの「きあいのハチマキ」！ 全員が1回ずつターンを終えるまで耐える`);
        return;
      }
    }
    g.out.push(p); newOut.push(p);
    ev(events, `💥 ${pname(p)}さん 負け！`, [], 'out');
  });
  // 負けた人は、きあいのハチマキの「残り」から外す
  g.members.forEach(q=>{ const e=g.hands[q].endure; if(e) e.left=e.left.filter(x=>!isOut(g,x)); });
  return newOut;
}
/** 勝敗：残りが1人ならその人の勝ち。最後の人たちが同時に負けたら引き分け（耐えている人は残っている扱い） */
function checkOver(newOut){
  const g=G(); if(g.over) return;
  const alive=alivePids(g);
  if(alive.length>1) return;
  g.over=true;
  if(alive.length===1){ g.winners=alive; g.draw=false; }
  else { g.winners=newOut.slice(); g.draw=true; }
}
/** そのターンの最大文字数：もう1回＝1／いのちのたま＝3／フォーカスレンズ発動＝2 */
function turnMax(g){
  const t=g.turn; if(!t) return gMaxChars(g);
  if(t.bonus) return 1;
  if(itemOf(g, t.pid)==='inochi') return inochiMax(g.members.length);   // 参加人数＋1
  if(t.focus) return Math.max(2, gMaxChars(g));
  return gMaxChars(g);
}
/** ターンの終わり：きあいのハチマキで耐えている人の「残り」から、ターンを終えた人を消す（空になったら負け） */
function endOfTurn(g, pid, events){
  g.members.forEach(q=>{
    const h=g.hands[q], e=h.endure; if(!e || isOut(g,q) || g.turnSeq<=e.seq) return;
    e.left=e.left.filter(x=>x!==pid);
    if(!e.left.length){
      delete h.endure; g.out.push(q);
      ev(events, `💥 ${pname(q)}さんの「きあいのハチマキ」が切れた… 負け！`, [], 'out');
      checkOver([q]);
    }
  });
}
/** いのちのたま：通常のターンの最後に、自分の文字が1種類開く（ゲームが終わっていれば開かない） */
function inochiSelfOpen(g, pid, events){
  if(g.over || itemOf(g,pid)!=='inochi' || isOut(g,pid)) return;
  reveal(g, pid);
  const c=pickOne(unopenedLetters(g, pid, null));
  if(!c) return;
  const hb=herbBlocker(g, c, pid);   // 反動の文字がハーブを持つ人にもあれば取り消し
  if(hb){ reveal(g, hb); ev(events, `🛡 ${pname(pid)}さんの「いのちのたま」の反動で「${c}」が開きそうになったが、${pname(hb)}さんの「メンタルハーブ」で取り消し！`); return; }
  openLetter(g, c);
  ev(events, `🔴 ${pname(pid)}さんの「いのちのたま」の反動！ 自分の文字「${c}」がオープン`, [c]);
  checkOver(processOuts(g, events));
}
function newResult(g, pid, extra){
  return Object.assign({ id:uid(), pid, name:pname(pid), kind:null, vals:[], hits:[], flashes:[], opened:[], outNames:[], skipped:false, wasBonus:false, correct:false, bonus:false, events:[] }, extra||{});
}
/** 結果の表示を始める：道具の効果を1つずつ出し終わってから「結果を表示する時間」で次のターンへ */
function startReveal(g){
  const r=g.lastResult, n=r ? r.events.length : 0, ms=S().itemEventSec*1000;
  g.revealStartAt=Date.now();
  g.revealEventsEndAt=g.revealStartAt + (n ? 800 + (n-1)*ms : 0);
  g.revealEndsAt=g.revealEventsEndAt + S().revealSec*1000;
}
function shownEvents(g){
  const r=g.lastResult; if(!r || !r.events.length) return 0;
  if(gs.phase!=='reveal') return r.events.length;
  const ms=S().itemEventSec*1000, t=Date.now()-(g.revealStartAt||0);
  return t<800 ? 0 : Math.min(r.events.length, 1+Math.floor((t-800)/ms));
}
/** ホスト画面でまだ見せていない文字（道具の効果を順番に見せるため） */
function hiddenLetters(g){
  const r=g.lastResult; if(!r || gs.phase!=='reveal') return [];
  return r.events.slice(shownEvents(g)).flatMap(e=>e.letters);
}
function toReveal(g){ g.turn=null; startReveal(g); gs.phase='reveal'; commit(); }

/** bonus=true：正解したあとの追加の行動（文字1つ）。制限時間は別設定 */
function beginTurn(bonus){
  const g=G(), sec=bonus ? S().bonusSec : S().answerSec;
  if(!bonus) g.turnSeq=(g.turnSeq||0)+1;
  const pid=g.turnOrder[g.turnIdx];
  g.turn={ id:uid(), pid, endsAt:Date.now()+sec*1000, durMs:sec*1000, bonus:!!bonus, focus:false };
  g.lastResult=null;
  if(!bonus && g.items && turnStartItems(g, pid)) return;
  gs.phase='turn';
  commit();
}
/** ターン開始時の道具（パス・こうかくレンズ・フォーカスレンズ）。ターンが終わったら true */
function turnStartItems(g, pid){
  const h=g.hands[pid], events=[];
  // ひかりのこな（持っている人それぞれ判定・パスは重ならない）
  const src=livingOthers(g, pid).filter(q=>itemOf(g,q)==='hikari').find(()=>roll(S().pHikari));
  if(src){
    reveal(g, src);
    g.lastResult=newResult(g, pid, { skipped:true, reason:'hikari', events });
    ev(events, `✨ ${pname(src)}さんの「ひかりのこな」が発動！ ${pname(pid)}さんのターンはパス`);
    endOfTurn(g, pid, events); toReveal(g); return true;
  }
  g.turnNotes=[];
  // いのちのたま：公開はターンが終わって反動が出たとき（inochiSelfOpen）
  // こうかくレンズ：ほかの人（負けた人は除く）を1人選び、その人の文字を1種類開く。これがこのターンの回答（もう1回なし）
  if(itemOf(g,pid)==='koukaku' && roll(S().pKoukaku)){
    reveal(g, pid);
    const target=pickOne(livingOthers(g, pid).filter(q=>unopenedLetters(g, q, pid).length));
    g.lastResult=newResult(g, pid, { kind:'koukaku', events });
    (g.turnNotes||[]).forEach(t=>ev(events, t));
    if(target) itemOpen(g, pid, 'koukaku', target, true, events);
    else ev(events, `✨ ${pname(pid)}さんの「こうかくレンズ」が発動！ でも開ける文字がなかった`);
    checkOver(processOuts(g, events));
    g.log.push({ name:pname(pid), vals:[], item:'koukaku' });
    if(!g.over) endOfTurn(g, pid, events);
    toReveal(g); return true;
  }
  // フォーカスレンズ：最初の回答順で一番最後の人だけ。発動したらこのターンは文字2つ
  if(itemOf(g,pid)==='focus' && g.focusLast===pid && gMaxChars(g)<2 && roll(S().pFocus)){
    revealNow(g, pid); g.turn.focus=true;
    g.turnNotes.push(`🔍 ${pname(pid)}さんの「フォーカスレンズ」！ このターンは文字を2つまで選べる`);
  }
  return false;
}
function startTurns(){
  const g=G(); if(gs.phase!=='order') return;
  g.turnIdx=0; beginTurn();
}
/** 回答を反映：誰かのポケモンに含まれていればオープン（全員）。道具の効果 → 負け判定 → いのちのたま → ターン終わり */
function applyAnswer(vals){
  const g=G(), t=g.turn, pid=t.pid, events=[];
  vals=vals.slice(0, turnMax(g));
  const wasOpen={};
  g.members.forEach(p=>{ wasOpen[p]=g.hands[p].final.map(pk=>nameOpen(pk.n, g.called.chars)); });
  vals.forEach(v=>openLetter(g, v));
  const all=[]; g.members.forEach(p=>g.hands[p].final.forEach((pk,i)=>all.push({p,i,pk})));
  const hits=vals.map(v=>({ v, count:all.filter(x=>pkHas(x.pk, v)).length }));
  const flashes=all.filter(x=>vals.some(v=>pkHas(x.pk, v))).map(x=>x.p+':'+x.i);
  const opened=[];
  g.members.forEach(p=>g.hands[p].final.forEach((pk,i)=>{ if(!wasOpen[p][i] && nameOpen(pk.n, g.called.chars)) opened.push({owner:pname(p), n:pk.d||pk.n}); }));
  // 正解＝ほかの人のポケモンに1つでも含まれていた（回答で開いたときだけ）
  const correct=all.some(x=>x.p!==pid && vals.some(v=>pkHas(x.pk, v)));
  (g.turnNotes||[]).forEach(t2=>ev(events, t2));
  if(g.items){
    const hitBy=q=>!isOut(g,q) && q!==pid && namesOf(g,q).some(n=>vals.some(v=>n.includes(v)));
    // ゴツゴツメット：開いた後で、開いているマスの数が回答者と同じかそれより多ければ発動。2人分なら回答者は2文字開く
    const helmets=g.turnOrder.filter(q=>hitBy(q) && itemOf(g,q)==='gotsu' && openedSlots(g,q) >= openedSlots(g,pid));
    helmets.forEach(q=>{ reveal(g,q); itemOpen(g, q, 'gotsu', pid, true, events); });
    // ばくはつハチマキ：ほかの人全員の文字を1種類ずつ（持ち主の文字は選ばない）
    g.turnOrder.filter(q=>hitBy(q) && itemOf(g,q)==='bakuhatsu').forEach(q=>{
      if(!roll(S().pBaku)) return;
      reveal(g,q);
      livingOthers(g, q).forEach(tg=>itemOpen(g, q, 'bakuhatsu', tg, true, events));
    });
  }
  const newOut=processOuts(g, events);
  checkOver(newOut);
  g.lastResult=newResult(g, pid, { kind:'chars', vals, hits, flashes, opened, outNames:newOut.map(pname), wasBonus:!!t.bonus, correct, events });
  g.log.push({ name:pname(pid), vals, bonus:!!t.bonus });
  g.lastResult.bonus = correct && !t.bonus && !g.over && !isOut(g,pid);
  if(!g.lastResult.bonus) inochiSelfOpen(g, pid, events);   // ターンが終わったら自分の文字が開く（正解したら、もう1回のあと）
  if(!g.lastResult.bonus && !g.over) endOfTurn(g, pid, events);
  toReveal(g);
}
function skipTurn(reason){
  const g=G(), t=g.turn; if(!t) return;
  const events=[];
  (g.turnNotes||[]).forEach(t2=>ev(events, t2));
  g.lastResult=newResult(g, t.pid, { skipped:true, reason, wasBonus:!!t.bonus, events });
  g.log.push({ name:pname(t.pid), vals:[] });
  inochiSelfOpen(g, t.pid, events);   // 時間切れで何も選ばなくてもターンが終わったら開く（もう1回の時間切れも）
  if(!g.over) endOfTurn(g, t.pid, events);
  toReveal(g);
}
function nextTurn(){
  const g=G(); if(gs.phase!=='reveal') return;
  if(g.over){ finishGame(); return; }
  if(g.lastResult && g.lastResult.bonus){ beginTurn(true); return; }   // 同じ人がもう1回（文字1つ）
  g.turnNotes=[];
  const n=g.turnOrder.length;
  for(let k=1;k<=n;k++){
    const idx=(g.turnIdx+k)%n;
    if(!isOut(g, g.turnOrder[idx])){ g.turnIdx=idx; break; }
  }
  beginTurn();
}
function finishGame(){
  const g=G();
  gs.phase='end';
  if(!g.practice){
    gs.gameCount++;
    const h=getHistory();
    h.push({ id:uid(), at:Date.now(), label:g.label, mode:modeText(g), players:g.members.map(pname), winners:g.winners.map(pname), draw:!!g.draw,
             turns:g.log.length, words:g.words.slice() });
    setHistory(h);
  }
  commit();
}
function abortGame(){
  if(!confirm('このゲームを中止しますか？\n（勝ち負けは記録されません。参加者画面に戻ります）')) return;
  gs.game=null; gs.phase='lobby'; commit();

/* ----- タイマー（画面全体は描き直さず数字だけ更新・時間切れの処理） ----- */
let lastShownEvents=-1;
function tickHost(){
  const g=gs && G(); if(!g) return;
  if(gs.phase==='reveal'){
    // 道具の効果を1つずつ見せる
    const se=shownEvents(g);
    if(se!==lastShownEvents){ lastShownEvents=se; renderHost(); }
    if(!g.over && g.revealEndsAt){
      const rms=g.revealEndsAt-Date.now();
      const rel=document.getElementById('reveal-count'); if(rel) rel.textContent=Math.max(1, Math.ceil(rms/1000));
      if(rms<=0){ g.revealEndsAt=null; nextTurn(); }
    }
    return;
  }
  lastShownEvents=-1;
  let endsAt=null, id=null;
  if(gs.phase==='select'){ endsAt=g.selEndsAt; id='sel-'+g.id; }
  else if(gs.phase==='turn' && g.turn){ endsAt=g.turn.endsAt; id=g.turn.id; }
  if(endsAt==null) return;
  const ms=Math.max(0, endsAt-Date.now());
  const el=document.getElementById('host-timer');
  if(el){ el.innerHTML=`${Math.ceil(ms/1000)}<span class="unit">秒</span>`; el.classList.toggle('zero', ms<=0); }
  if(ms<=0 && firedId!==id){
    firedId=id;
    if(gs.phase==='select') finishSelect();
    else skipTurn('timeout');
  }
}

function openQrModal(){
  if(!myHostId){ showToast('部屋を準備中です'); return; }
  const m=openModal(`<h3>参加用QRコード</h3><div style="text-align:center"><div class="qrbox" id="qr-modal"></div><div class="url" style="color:#666">${esc(joinUrl())}</div></div>`);
  new QRCode(m.el.querySelector('#qr-modal'), {text:joinUrl(), width:260, height:260});
}
function kickPlayer(pid){
  if(!gs.players[pid] || !confirm(`${pname(pid)}さんを参加者から外しますか？`)) return;
  sendTo(pid, {type:'removed'});
  const c=conns[pid]; delete conns[pid]; connected.delete(pid);
  delete gs.players[pid];
  gs.order=gs.order.filter(p=>p!==pid);
  setTimeout(()=>{ try{ c&&c.close(); }catch(err){} }, 300);
  commit();
}

function onHostClick(e){
  const b=e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  const act=b.dataset.act;
  const withRule=()=>{ const c=document.getElementById('chk-rule'); return c ? c.checked : false; };
  if(act==='qr') openQrModal();
  else if(act==='admin'){ if(gs.phase==='lobby' || confirm('管理ページを開きますか？\n（ゲームの進行状況は保存されます。戻ると「続きから再開」できます）')) location.href=location.pathname+'?mode=admin'; }
  else if(act==='newroom'){
    if(!confirm('新しい部屋を作り直しますか？\n（今の進行状況は消え、スマホはQRから入り直しになります）')) return;
    localStorage.removeItem(LS.state); localStorage.removeItem(LS.room);
    location.reload();
  }
  else if(act==='kick') kickPlayer(b.dataset.pid);
  else if(act==='start-practice') beginGame(true, withRule());
  else if(act==='start-honban') beginGame(false, withRule());
  else if(act==='rule-next') advanceRule();
  else if(act==='rule-prev') retreatRule();
  else if(act==='rule-skip') dealGame(gs.pendingPractice);
  else if(act==='sel-end'){ if(confirm('ポケモン選択を締め切りますか？\n（確定していない人は、選んでいる分はそのまま・足りない分をランダムで選びます）')) finishSelect(); }
  else if(act==='turns') startTurns();
  else if(act==='skip'){ if(confirm(`${pname(G().turn.pid)}さんの番をスキップしますか？（何も選ばずに次の人へ）`)) skipTurn('host'); }
  else if(act==='next') nextTurn();
  else if(act==='abort') abortGame();
  else if(act==='honban-now') startHonbanNow();
  else if(act==='next-game'){ loadAppData().then(()=>{ gs.settings=JSON.parse(JSON.stringify(appData.settings)); dealGame(b.dataset.practice==='1'); }); }
  else if(act==='to-lobby'){ gs.game=null; gs.phase='lobby'; commit(); }
  else if(act==='item-tip'){ const k=b.dataset.item; openModal(`<div style="display:flex;gap:12px;align-items:center">${itemImg(k,64)}<h3 style="margin:0">${esc(itemName(k))}</h3></div><p style="font-size:17px;line-height:1.6">${esc(G() ? itemDesc(k, S(), G().wordSet, G().members.length) : itemDesc(k, S(), 'poke'))}</p>`); }
  else if(act==='item-list'){ loadAppData().then(()=>openModal(`<h3>道具一覧（強い順）</h3>${itemListHtml(appData.settings, gs.opt.set)}`)); }
  else if(act==='gens-all'){ gs.opt.gens=allGens(); lsSet(LS.opt, gs.opt); saveState(); renderHost(); }
}

/* ----- 盤面（文字表・各参加者のポケモン） ----- */
/* 使われた文字は、当たり外れに関係なくすべてグレーアウト。対象の世代に出てこない文字は表から消す */
function visibleCalled(g){ const hid=hiddenLetters(g); return hid.length ? g.called.chars.filter(c=>!hid.includes(c)) : g.called.chars; }
function kanaTableHtml(g, just){
  const cells=[], vc=visibleCalled(g), allowed=new Set(gAllowed(g));
  for(let r=0;r<5;r++){
    for(let ci=TABLE_COLS.length-1; ci>=0; ci--){
      const c=TABLE_COLS[ci][r]||'　';
      if(c==='　' || !allowed.has(c)){ cells.push('<div class="kc blank"></div>'); continue; }
      cells.push(`<div class="kc ${vc.includes(c)?'called':''} ${just.includes(c)?'just':''}">${esc(c)}</div>`);
    }
  }
  return `<div class="ktable" style="grid-template-columns:repeat(${TABLE_COLS.length},1fr)">${cells.join('')}</div>`;
}
/** ホスト画面のポケモン1匹：名前は常に「？」6個（文字数は分からない）。オープンした文字はその位置に出す */
function pkCardHost(g, pk, key, showAll, just){
  const chars=visibleCalled(g), open=nameOpen(pk.n, chars);
  const flash=g.lastResult && gs.phase==='reveal' && g.lastResult.flashes.includes(key);
  if(open || showAll){
    return `<div class="pk ${open?'open':''} ${flash?'flash':''}">${open?'<span class="stamp">OPEN</span>':''}
      <div class="nm ${open?'':'dim'}">${esc(pk.d||pk.n)}</div>${pk.d&&pk.d!==pk.n?`<div class="rd">${esc(pk.n)}</div>`:''}</div>`;
  }
  const name=[...pk.n], slots=[];
  for(let i=0;i<Math.max(NAME_SLOTS, name.length);i++){
    const c=name[i];
    if(c!=null && TABLE_SET.has(c) && chars.includes(c)) slots.push(`<span class="op ${just.includes(c)?'just':''}">${esc(c)}</span>`);
    else if(c!=null && !TABLE_SET.has(c)) slots.push(`<span class="op">${esc(c)}</span>`);
    else slots.push('<span>？</span>');
  }
  return `<div class="pk ${flash?'flash':''}"><div class="slots">${slots.join('')}</div></div>`;
}
/** 道具の表示：発動するまで「？」（道具なしの人も「？」）。ゲーム終了で全部見せる */
function itemBadge(g, p){
  if(!g.items) return '';
  const r=g.lastResult, pending = gs.phase==='reveal' && r ? r.events.slice(shownEvents(g)).some(e=>(e.reveals||[]).includes(p)) : false;
  const k=itemOf(g,p), h=g.hands[p], show=gs.phase==='end' || (h.revealed && !pending);
  if(!show) return `<span class="ibadge">${itemImg(null,34)}道具：？</span>`;
  if(!k) return '<span class="ibadge">道具：なし</span>';
  // 効果は吹き出しで重ねて出す（枠の大きさは変えない）。この結果で公開された道具は自動で出す。ほかはマウスを乗せる／クリックで出す
  const justNow = gs.phase==='reveal' && r && r.events.slice(0, shownEvents(g)).some(e=>(e.reveals||[]).includes(p));
  return `<span class="ibadge on ${justNow?'show-tip':''}" data-act="item-tip" data-item="${k}">${itemImg(k,34)}${esc(itemName(k))}<span class="itip"><b>${esc(itemName(k))}</b>${esc(itemDesc(k, S(), g.wordSet, g.members.length))}</span></span>`;

function revealHtml(g){
  const x=g.lastResult; if(!x) return '';
  const se=shownEvents(g), allShown=se>=x.events.length;
  let what, res;
  if(x.skipped){
    what=`${esc(x.name)} さん`;
    res = x.reason==='host' ? '<span class="miss">スキップしました</span>'
        : x.reason==='timeout' ? '<span class="miss">⏰ 時間切れ！ 何も選ばずに次の人へ</span>' : '';
  } else if(x.kind==='koukaku'){
    what=`${esc(x.name)} さん`; res='';
  } else {
    what=`${esc(x.name)} さん${x.wasBonus?'（もう1回）':''}：${x.vals.map(v=>`<span class="v">${esc(v)}</span>`).join('')}`;
    res=x.hits.map(h=>h.count?`<span class="hit">「${esc(h.v)}」ヒット！（${h.count}匹）</span>`:`<span class="miss">「${esc(h.v)}」は誰も持っていません</span>`).join('　');
    if(x.opened.length) res+=`<div>${x.opened.map(o=>`🎯 ${esc(o.owner)}さんの「${esc(o.n)}」が全部オープン！`).join('<br>')}</div>`;
  }
  res+=x.events.slice(0, se).map(e=>`<div class="iev ${e.cls}">${esc(e.text)}</div>`).join('');
  if(allShown && x.bonus) res+=`<div class="bonus">⭕ 正解！ ${esc(x.name)}さんは、もう1回だけ文字を1つ選べます</div>`;
  const right = !allShown ? '<div class="auto-next">…</div>'
    : g.over ? '<button class="primary big" data-act="next" data-enter>🏆 結果発表 ▶</button>'
    : `<div class="auto-next"><b id="reveal-count">${Math.max(1, Math.ceil(((g.revealEndsAt||Date.now())-Date.now())/1000))}</b>秒後に${x.bonus?`${esc(x.name)}さんのもう1回`:'次の人の番'}へ<br><button class="small" data-act="next">すぐ進む ▶</button></div>`;
  return `<div class="reveal"><div class="what">${what}</div><div class="res">${res}</div>${right}</div>`;
}

    body=`${ph==='reveal'?revealHtml(g):turnBarHtml(g)}
      <div class="board-mid">${kanaTableHtml(g, just)}</div>
      ${playersHtml(g, false)}`;
  }
  else if(ph==='end'){
    const names=g.winners.map(pname);
    const banner = g.draw
      ? `<div class="final-banner draw"><div class="big">引き分け</div><div style="font-size:22px;font-weight:800">${names.map(esc).join('さん・')}さんが同時に負けました</div></div>`
      : `<div class="final-banner ${g.practice?'practice':''}"><div class="big">🏆 ${esc(names[0]||'')} さんの勝ち！</div>${g.practice?'<div style="font-size:20px;font-weight:800">（例題のため勝ち負けは記録しません）</div>':''}</div>`;
    body=`${banner}
      <div class="btnbar">
        ${g.practice
          ? `<button class="primary big" data-act="next-game" data-practice="0" data-enter>▶ 本番 ${esc(nextLabel(false))}を始める</button>`
          : `<button class="primary big" data-act="next-game" data-practice="0" data-enter>▶ ${esc(nextLabel(false))}を始める（同じメンバー）</button>`}
        <button class="ghost" data-act="to-lobby">参加者を確認する（QR画面へ）</button>
      </div>
      <div class="board-mid">${kanaTableHtml(g, [])}</div>
      ${playersHtml(g, true)}`;
  }
  app.innerHTML=`<div class="page">${hostTopbar()}${body}</div>`;
  const qr=document.getElementById('qr');
  if(qr && myHostId) new QRCode(qr, {text:joinUrl(), width:260, height:260});
  if(ph==='order' && g.orderShown<g.turnOrder.length && !orderAnimTimer) playOrderAnim();
}

/* =========================================================
   参加者画面（スマホ）
   ========================================================= */
let myPeer=null, myConn=null, myPid='', myName='', sub=null, removedByHost=false, subTimerEnds=null, subTick=null;
let lastModalKey=null;
let subPick={gameId:null, picks:[]};                 // ポケモン選択（自分の画面の選択状態）
let subAns={turnId:null, c1:'', c2:'', text:'', sent:false};   // 自分の番の回答（決定を押すまでは送らない）

function initSub(){
  requestWakeLock();
  myPid=sessionStorage.getItem(SS_PID) || uid();
  sessionStorage.setItem(SS_PID, myPid);
  myName=sessionStorage.getItem(SS_NAME) || '';
  renderConnecting();
  subTick=setInterval(tickSubTimer, 250);
  myPeer=new Peer();
  myPeer.on('open', ()=>connectToHost(params.get('room')));
  myPeer.on('disconnected', ()=>{ try{ myPeer.reconnect(); }catch(e){} });
  myPeer.on('error', err=>console.error(err));
  document.getElementById('app').addEventListener('click', onSubClick);
  document.getElementById('app').addEventListener('change', onSubChange);
  document.getElementById('app').addEventListener('input', onSubInput);
}
function connectToHost(roomId){
  let timer=null;
  const retry=()=>{ if(removedByHost) return; clearTimeout(timer); timer=setTimeout(tryConnect, 3000); };
  function tryConnect(){
    if(removedByHost) return;
    try{
      const conn=myPeer.connect(roomId, {reliable:true});
      myConn=conn;
      conn.on('open', ()=>{ if(myName) sendJoin(); else renderNameForm(''); });
      conn.on('data', handleHostMessage);
      conn.on('close', ()=>{ if(myConn===conn){ renderConnecting(); retry(); } });
      conn.on('error', ()=>{ if(myConn===conn) retry(); });
      setTimeout(()=>{ if(myConn===conn && !conn.open){ try{ conn.close(); }catch(e){} retry(); } }, 8000);
    }catch(e){ retry(); }
  }
  tryConnect();
}
function sendHost(msg){ if(myConn && myConn.open){ try{ myConn.send(msg); return true; }catch(e){} } showToast('通信が切れています。再接続をお待ちください'); return false; }
function sendJoin(){ sendHost({type:'join', pid:myPid, name:myName}); }
function renderConnecting(){
  document.getElementById('app').innerHTML=`<div class="page"><div class="p-center"><div class="spinner"></div>
    <p>ホスト画面に接続しています…</p><p class="muted" style="font-size:13px">つながらない場合はそのまま少しお待ちください（自動で再接続します）</p></div></div>`;
}
function renderNameForm(err){
  document.getElementById('app').innerHTML=`<div class="page"><div class="p-center">
    <h2>${esc(GAME_TITLE)}</h2>
    <p>ニックネームを入力してください</p>
    ${err?`<p style="color:var(--danger)">${esc(err)}</p>`:''}
    <input type="text" id="nick" maxlength="12" placeholder="ニックネーム（12文字まで）" value="${esc(myName)}">
    <div style="margin-top:14px"><button class="primary" id="btn-join" style="width:100%;padding:14px;font-size:17px">参加する</button></div>
    <p class="muted" style="font-size:13px">途中で画面を閉じてしまった場合は、同じニックネームで入り直すと復帰できます</p>
  </div></div>`;
  document.getElementById('btn-join').onclick=()=>{
    const v=document.getElementById('nick').value.trim();
    if(!v){ alert('ニックネームを入力してください'); return; }
    myName=v; sessionStorage.setItem(SS_NAME, v);
    sendJoin();
  };
}
function handleHostMessage(data){
  if(!data) return;
  if(data.type==='state'){
    sub=data;
    useTable(data.wordSet||'poke');
    subTimerEnds = data.phase==='select' && data.remainingMs!=null ? Date.now()+data.remainingMs
                 : data.turn ? Date.now()+data.turn.remainingMs : null;
    renderSub();
  } else if(data.type==='toast'){ showToast(data.text, 3500); if(subAns) { subAns.sent=false; renderSub(); } }
  else if(data.type==='name_taken'){
    myName=''; sessionStorage.removeItem(SS_NAME);
    renderNameForm('そのニックネームは使われています。別のニックネームにしてください');
  } else if(data.type==='removed'){
    removedByHost=true; sessionStorage.removeItem(SS_NAME); sessionStorage.removeItem(SS_PID);
    document.getElementById('app').innerHTML=`<div class="page"><div class="p-center"><h2>参加者から外れました</h2><p>もう一度参加する場合はQRコードを読み直してください。</p></div></div>`;
  }
}
function tickSubTimer(){
  const el=document.getElementById('sub-timer'); if(!el || subTimerEnds==null) return;
  const ms=Math.max(0, subTimerEnds-Date.now());
  el.textContent = ms<=0 ? '⏰ 時間です' : `残り ${Math.ceil(ms/1000)}秒`;
  el.classList.toggle('zero', ms<=5000);
}
/** 道具の表示（スマホ用） */
function subItemHtml(k, s){
  if(!s || !s.items) return '';
  if(!k) return '<div class="sitem none">道具：なし</div>';
  const inf=(s.itemInfo||{})[k]||{name:k, desc:''};
  return `<div class="sitem has-img">${itemImg(k,52)}<div><b>道具：${esc(inf.name)}</b><div>${esc(inf.desc)}</div><div class="muted" style="font-size:11px;margin-top:2px">ほかの人に公開されるのは：${esc(ITEM_OPEN[k]||'')}</div></div></div>`;
}
function pkNameHtml(pk){ return `<div class="nm">${esc(pk.d||pk.n)}</div>${pk.d&&pk.d!==pk.n?`<div class="rd">${esc(pk.n)}</div>`:''}`; }
/** 自分のポケモン。名前が全部オープンされたものは暗くして「オープン済」。道具ありなら道具と効果も出す */
function myPkHtml(list, calledChars, s){
  const cc=calledChars||[];
  return `<div class="mypk" style="grid-template-columns:repeat(${Math.max(1,(list||[]).length)},1fr)">${(list||[]).map(pk=>{ const open=nameOpen(pk.n, cc);
    return `<div class="m ${open?'opened':''}">${open?'<span class="ostamp">オープン済</span>':''}${pkNameHtml(pk)}</div>`; }).join('')}</div>
    ${(list||[]).length===1 ? subItemHtml(list[0].item, s) : ''}
    ${s && s.megane ? `<div class="sitem"><b>みとおしメガネ</b><div>${s.megane.map(m=>`${esc(m.name)}さん：<b>${m.len}文字</b>${m.out?'（負け）':''}`).join('<br>')}</div></div>` : ''}`;
}
function renderSub(){
  const s=sub; if(!s) return;
  const app=document.getElementById('app');
  document.title=s.title||GAME_TITLE;
  // 番が変わったら確認ポップアップを閉じる

  if(mk!==lastModalKey){ closeAllModals(); lastModalKey=mk; }
  const head=`<div class="sub-head"><div>${esc(s.name)} さん</div><div>${s.member&&s.label?esc(s.label)+(s.practice?'（練習）':''):''}</div></div>`;
  let html='';
  if(!s.gameId || !s.member){
    html=`${head}<div class="p-center"><h2>${esc(s.name)} さん、ようこそ！</h2><p style="font-size:18px">ホストの画面を見てください</p>

  }

    if(subPick.gameId!==s.gameId) subPick={gameId:s.gameId, picks:(s.picks||[]).slice()};
    if(s.confirmed) subPick.picks=(s.picks||[]).slice();

    html=`${head}<div class="role-banner">${s.confirmed?'✅ 確定しました':`${WL}を${K}${U}選んでください`}</div>
      <div class="p-timer" id="sub-timer"></div>
      <div class="deal ${s.confirmed?'locked':''}">${(s.deal||[]).map((pk,i)=>{ const on=subPick.picks.includes(i);
        return `<div class="d ${on?'on':''}" data-pick="${i}">${on?'<span class="ck">✔</span>':''}${pkNameHtml(pk)}${s.items?`<div class="ditem">${pk.item?`${itemImg(pk.item,48)}<br>${esc(((s.itemInfo||{})[pk.item]||{}).name||'')}<small>${esc(((s.itemInfo||{})[pk.item]||{}).desc||'')}</small>`:'<span class="muted">道具なし</span>'}</div>`:''}</div>`; }).join('')}</div>
      ${s.confirmed?'<p class="muted" style="text-align:center">全員の確定（または時間切れ）を待っています…</p>'
        :`<div class="bottom-btns"><button class="primary" data-sub="pick-confirm" ${n===K?'':'disabled'}>確定（${n} / ${K}）</button></div>
          <p class="muted" style="font-size:13px;text-align:center">時間切れの場合、選んでいる分はそのまま・足りない分はランダムで選ばれます</p>`}`;
  }
  else {
    const mine=myPkHtml(s.mine, s.calledChars, s);
    const WL=wordLabel(s.wordSet);
    if(s.phase==='end'){
      const r=s.result||{};
      html=`${head}<div class="role-banner ${r.draw?'wait':''}">${r.draw?'引き分け':`🏆 ${esc((r.winnerNames||[])[0]||'')} さんの勝ち！`}</div>
        <div class="p-center" style="padding:14px"><p>結果はホストの画面を見てください</p></div>${mine}`;
    }
    else if(s.phase==='turn' && s.turn && s.turn.isMe){
      html=`${head}<div class="role-banner">${s.turn.bonus?'⭕ 正解！ もう1回（文字1つ）':'🎤 あなたの番です'}</div>
        ${s.turn.focus?'<div class="role-banner" style="background:#ffd8a8">🔍 フォーカスレンズ！ このターンは文字2つまで</div>':''}
        ${s.enduring?'<div class="role-banner" style="background:#d0bfff">💪 きあいのハチマキで耐えています</div>':''}
        <div class="p-timer" id="sub-timer"></div>
        <div class="lbl muted" style="font-size:13px;font-weight:800;margin:4px 0">あなたの${WL}</div>${mine}${answerHtml(s)}`;
    }
    else {
      let msg;
      if(s.phase==='order') msg='回答順を発表中…';
      else if(s.phase==='turn' && s.turn) msg=`${esc(s.turn.name)} さんの番です`;
      else if(s.phase==='reveal') msg='ホストの画面を見てください';
      else msg='ホストの画面を見てください';
      html=`${head}${s.out?'<div class="role-banner out">💥 あなたは負けました</div>':''}${s.enduring&&!s.out?'<div class="role-banner" style="background:#d0bfff">💪 きあいのハチマキで耐えています</div>':''}
        <div class="role-banner wait">${msg}</div>
        ${s.phase==='turn'&&s.turn?'<div class="p-timer" id="sub-timer"></div>':''}
        <div class="lbl muted" style="font-size:13px;font-weight:800;margin:4px 0">あなたの${WL}</div>${mine}
        ${s.orderNames&&s.orderNames.length?`<p class="muted" style="font-size:13px">回答順：${s.orderNames.map(esc).join(' → ')}</p>`:''}`;
    }
  }
  // 解答欄に入力中なら、描き直してもフォーカス・カーソル位置を戻す
  const ae=document.activeElement, keepFocus=ae && ae.id==='a-text', selS=keepFocus?ae.selectionStart:0, selE=keepFocus?ae.selectionEnd:0;
  app.innerHTML=`<div class="page">${html}</div>`;
  if(keepFocus){ const t=document.getElementById('a-text'); if(t){ t.focus(); try{ t.setSelectionRange(selS, selE); }catch(e){} } }
  updateAnsUI();
  tickSubTimer();

/** 自分の番：文字を選ぶプルダウン（2文字モードは2つ・それ以外と正解後のもう1回は1つ）＋解答欄。選ばれた文字は選択肢から外す */
function ansMax(s){ s=s||sub; return s && s.turn ? (s.turn.maxChars || (s.turn.bonus ? 1 : (s.maxChars||2))) : 1; }
function ownChars(s){ s=s||sub; return new Set((s && s.mine || []).flatMap(pk=>[...pk.n])); }
function answerHtml(s){
  if(subAns.turnId!==s.turn.id) subAns={turnId:s.turn.id, text:'', sent:false};
  if(subAns.sent) return `<div class="p-center" style="padding:16px"><div class="spinner"></div><h3>送信しました</h3><p>ホストの画面を見てください</p></div>`;
  const max=ansMax(s), own=ownChars(s);
  const chars=(s.allowedChars||TABLE_CHARS).filter(c=>!s.calledChars.includes(c));
  const opt=(cur, ph)=>`<option value="">${ph}</option>`+chars.map(c=>`<option value="${esc(c)}" ${c===cur?'selected':''} ${own.has(c)?'class="own"':''}>${esc(c)}${own.has(c)?'（自分）':''}</option>`).join('');
  const nums=[...Array(max).keys()].map(i=>i===0?'1文字目':`${i+1}文字目（なし）`);
  const ex = TABLE_KIND==='yoji' ? 'かいて' : 'カイテ';
  return `<div class="ans-box">
      <div class="lbl">文字を選ぶ（${max===1?'1つ':`最大${max}つ`}）</div>
      <div class="${max>1?'ans-sels':''}" style="${max>=3?'grid-template-columns:1fr 1fr 1fr':''}">${[...Array(max).keys()].map(i=>`<select id="a-c${i+1}">${opt(subAns['c'+(i+1)]||'', max===1?'文字を選ぶ':nums[i])}</select>`).join('')}</div>
      <div class="lbl" style="margin-top:12px">解答欄に入力してもOK（${TABLE_KIND==='yoji'?'カタカナでも大丈夫':'ひらがなでも大丈夫'}）</div>
      <input type="text" id="a-text" value="${esc(subAns.text)}" placeholder="例：${ex.slice(0,max)}" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="ans-err" id="a-err"></div>
      <div class="ans-pick" id="a-pick"></div>
      <div class="bottom-btns"><button class="primary" data-sub="ans-submit" id="a-submit" disabled>決定</button></div>
      <p class="muted" style="font-size:12px;text-align:center;margin:6px 0 0">決定を押さずに時間切れになると、何も選ばずに次の人へ移ります<br>
        <span class="own-note">赤い背景</span>＝あなたの${wordLabel(s.wordSet)}に含まれる文字</p>
    </div>`;
}
function ansVals(){
  const max=ansMax();
  return [...new Set([...Array(max).keys()].map(i=>subAns['c'+(i+1)]).filter(Boolean))].slice(0,max);
}
/** 選択中の表示・赤い背景・決定ボタンを、画面を描き直さずに更新する */
function updateAnsUI(){
  const box=document.querySelector('.ans-box'); if(!box || !sub || !sub.turn) return;
  const own=ownChars(), vals=ansVals();
  const tx=document.getElementById('a-text');
  document.querySelectorAll('select[id^="a-c"]').forEach(el=>{ const v=subAns[el.id.slice(2)]||''; el.value=v; el.classList.toggle('own', own.has(v)); });
  const err=subAns.textErr||'';
  if(tx) tx.classList.toggle('own', !err && [...normalizeKana(tx.value)].some(c=>own.has(c)));
  document.getElementById('a-err').textContent=err;
  const ownHit=vals.filter(v=>own.has(v));
  document.getElementById('a-pick').innerHTML = vals.length
    ? `選択中：${vals.map(v=>`<span class="v ${own.has(v)?'own':''}">${esc(v)}</span>`).join('')}${ownHit.length?`<div class="own-warn">⚠ あなたの${wordLabel(sub.wordSet)}に含まれる文字があります</div>`:''}`
    : '<span class="muted">まだ選んでいません</span>';
  document.getElementById('a-submit').disabled = !vals.length || !!err;
}
function onSubChange(e){
  if(/^a-c\d+$/.test(e.target.id)){
    subAns[e.target.id.slice(2)]=e.target.value;
    // プルダウンで選んだら、解答欄も同じ文字にそろえる
    subAns.text=ansVals().join(''); subAns.textErr='';
    const tx=document.getElementById('a-text'); if(tx) tx.value=subAns.text;
    updateAnsUI();
  }
}
function onSubInput(e){
  if(e.target.id!=='a-text' || !sub || !sub.turn) return;
  subAns.text=e.target.value;
  const r=parseAnswerText(e.target.value, ansMax(), sub.calledChars||[], sub.allowedChars);
  subAns.textErr=r.err;
  for(let i=0;i<ansMax();i++) subAns['c'+(i+1)]=r.chars[i]||'';
  updateAnsUI();
}
function onSubClick(e){
  const pk=e.target.closest('[data-pick]');
  if(pk && sub && sub.phase==='select' && !sub.confirmed){
    const i=Number(pk.dataset.pick), arr=subPick.picks;
    if(arr.includes(i)) subPick.picks=arr.filter(x=>x!==i);
    else if(arr.length>=(sub.keepN||3)){ showToast(`${sub.keepN||3}${WORD_SETS[sub.wordSet||'poke'].unit}まで選べます（外すにはもう一度タップ）`); return; }
    else subPick.picks=arr.concat(i);
    sendHost({type:'pick', gameId:sub.gameId, picks:subPick.picks, confirm:false});
    renderSub(); return;
  }
  const b=e.target.closest('[data-sub]'); if(!b || b.disabled || !sub) return;
  const act=b.dataset.sub;
  if(act==='pick-confirm'){
    const K=sub.keepN||3;
    if(subPick.picks.length!==K) return;
    const gid=sub.gameId, picks=subPick.picks.slice();
    const WL=wordLabel(sub.wordSet);
    openModal(`<h3>${K===1?`この${WL}`:`この${K}匹`}で確定しますか？</h3>
      <div class="mypk" style="margin:10px 0;grid-template-columns:repeat(${K},1fr)">${picks.map(i=>{ const pk=sub.deal[i]; return `<div class="m" style="background:#eef1f6;color:#1d1d1f">${pkNameHtml(pk)}</div>`; }).join('')}</div>
      ${K===1 && sub.items ? (sub.deal[picks[0]].item ? `<p style="display:flex;align-items:center;gap:8px">${itemImg(sub.deal[picks[0]].item,44)}<b>道具：${esc(((sub.itemInfo||{})[sub.deal[picks[0]].item]||{}).name||'')}</b></p>` : '<p>道具：なし</p>') : ''}
      <p style="font-size:13px;color:#666">確定すると変更できません</p>`, [
      {label:'やめる'},
      {label:'確定する', cls:'primary', onClick:()=>{
        if(!sub || sub.phase!=='select' || sub.gameId!==gid || sub.confirmed){ showToast('選択の時間が終わりました'); return; }
        sendHost({type:'pick', gameId:gid, picks, confirm:true});
      }}
    ]);
  }
  else if(act==='ans-submit') confirmAnswerSub();
}
function confirmAnswerSub(){
  const s=sub; if(!s || !s.turn || !s.turn.isMe) return;
  const vals=ansVals(); if(!vals.length || subAns.textErr) return;
  const turnId=s.turn.id;
  // 自分のポケモンに含まれているか
  const own=[];
  (s.mine||[]).forEach(pk=>vals.forEach(v=>{ if(pkHas(pk, v)) own.push({v, n:pk.n}); }));
  const label=vals.map(v=>`「${esc(v)}」`).join('');
  const html = own.length
    ? `<h3>本当に決定しますか？</h3><div class="warn">⚠ ${label} は<b>あなたの${wordLabel(s.wordSet)}にも含まれています</b><br>${own.map(o=>`・「${esc(o.v)}」→ ${esc(o.n)}`).join('<br>')}<br>決定すると、あなたの${wordLabel(s.wordSet)}もオープンされます。</div>`
    : `<h3>本当に決定しますか？</h3><p style="font-size:20px;font-weight:900">${label}</p>`;
  openModal(html, [
    {label:'やめる'},
    {label:'決定する', cls: own.length?'danger':'primary', onClick:()=>{
      if(!sub || !sub.turn || sub.turn.id!==turnId){ showToast('時間切れのため送信できませんでした'); return; }
      if(sendHost({type:'answer', turnId, vals})){ subAns.sent=true; renderSub(); }
    }}
  ]);
}

function readSettings(){
  const v=id=>toInt(document.getElementById(id).value);
  const s={ selectSec:v('s-select'), answerSec:v('s-answer'), bonusSec:v('s-bonus'), revealSec:v('s-reveal'), itemEventSec:v('s-iev') };
  PCT_KEYS.forEach(k=>{ s[k]=v('s-'+k); });
  s.inochiAdd=v('s-inochiAdd');
  const errors=[];
  if(isNaN(s.inochiAdd)||s.inochiAdd<0||s.inochiAdd>20) errors.push('いのちのたまの「参加人数＋」は0〜20の整数で入力してください');
  if(isNaN(s.itemEventSec)||s.itemEventSec<1) errors.push('道具の効果の表示間隔は1以上の整数で入力してください');
  if(PCT_KEYS.some(k=>isNaN(s[k])||s[k]<0||s[k]>100)) errors.push('道具の確率は0〜100の整数で入力してください');
  if(isNaN(s.selectSec)||s.selectSec<1) errors.push('ポケモンを選ぶ制限時間は1以上の整数で入力してください');
  if(isNaN(s.answerSec)||s.answerSec<1) errors.push('回答の制限時間（1回目）は1以上の整数で入力してください');
  if(isNaN(s.bonusSec)||s.bonusSec<1) errors.push('回答の制限時間（正解後の2回目）は1以上の整数で入力してください');
  if(isNaN(s.revealSec)||s.revealSec<1) errors.push('結果を表示する時間は1以上の整数で入力してください');
  return {s, errors};
}

function compressDataUrl(src, maxDim, quality){
  maxDim=maxDim||1000; quality=quality||0.8;
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>h){ if(w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;} } else { if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;} }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      resolve(c.toDataURL('image/jpeg',quality));
    };
    img.onerror=reject; img.src=src;
  });
}
function compressImageFile(file){
  return new Promise((resolve,reject)=>{ const rd=new FileReader(); rd.onload=e=>compressDataUrl(e.target.result).then(resolve,reject); rd.onerror=reject; rd.readAsDataURL(file); });
}
