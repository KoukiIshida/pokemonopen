<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ポケモンオープン</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#10192e; --panel:#1b2742; --panel2:#24324f; --text:#f4f6fb; --muted:#9aa6c0;
  --accent:#ffcc33; --danger:#e5484d; --ok:#3ccf7a; --blue:#2f7de1; --hit:#ff8a3d;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  -webkit-tap-highlight-color:transparent}
img{max-width:100%}
button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 18px;background:#3a4a6b;color:#fff;font-weight:700}
button:hover{filter:brightness(1.1)}
button.primary{background:var(--accent);color:#1a1a1a}
button.blue{background:var(--blue)}
button.danger{background:var(--danger)}
button.ghost{background:transparent;border:1px solid #4a5a7c;color:var(--text)}
button.small{padding:6px 12px;font-size:13px;border-radius:8px}
button.big{font-size:22px;padding:16px 36px}
button:disabled,button.done{background:#4a4f5a !important;color:#9aa0aa !important;cursor:not-allowed;filter:none}
input[type=text],input[type=number],textarea,select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #4a5a7c;background:#0d1526;color:var(--text)}
input[type=text],textarea{width:100%}
input[type=number]{width:90px;text-align:right}
h1,h2,h3{margin:0 0 12px}
.muted{color:var(--muted)}
.page{max-width:1100px;margin:0 auto;padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.center{justify-content:center}
.spacer{flex:1}
.card{background:var(--panel);border-radius:14px;padding:16px;margin-bottom:14px}
.note{background:#2c2410;border:1px solid #6b5520;color:#ffe9a8;border-radius:10px;padding:10px 14px;margin-bottom:12px}

/* ===== ヘッダー ===== */
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.topbar .title{font-size:22px;font-weight:900;letter-spacing:.05em;margin-right:6px}
.round-label{background:var(--accent);color:#1a1a1a;border-radius:8px;padding:3px 12px;font-weight:900}
.round-label.practice{background:#7a4dd8;color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#666}
.dot.on{background:var(--ok)}

/* ===== ホスト：ロビー等 ===== */
.lobby{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 0}
.qrbox{display:inline-block;background:#fff;padding:14px;border-radius:12px;line-height:0}
.url{word-break:break-all;font-size:14px;color:var(--muted);margin-top:8px}
.plist{display:flex;flex-direction:column;gap:8px;min-width:280px;max-height:420px;overflow:auto}
.pitem{background:var(--panel2);border-radius:10px;padding:10px 14px;font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
.stage{text-align:center;padding:10px 0}
.stage h2{font-size:30px}
.btnbar{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.timer{font-size:96px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;margin:10px 0}
.timer .unit{font-size:32px;margin-left:6px}
.timer.zero{color:var(--danger)}
.sel-status{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:18px 0;text-align:center}
.sel-status .s{background:var(--panel);border-radius:12px;padding:14px;font-size:22px;font-weight:900}
.sel-status .s .st{font-size:18px;margin-top:6px;color:var(--muted)}
.sel-status .s.ok{background:#174a2e}
.sel-status .s.ok .st{color:#8ff0b6}
.order-list{display:flex;flex-direction:column;gap:12px;align-items:center;margin:20px 0}
.order-item{font-size:40px;font-weight:900;background:var(--panel);border-radius:14px;padding:10px 36px;min-width:420px;animation:pop .35s ease-out}
.order-item .no{color:var(--accent);margin-right:16px}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}

/* ===== ホスト：盤面 ===== */
.turnbar{display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:14px;padding:10px 14px;margin-bottom:12px;min-height:92px}
.turn-order{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1}
.turn-order .lbl{font-size:13px;color:var(--muted);font-weight:800;width:100%}
.to-item{background:var(--panel2);border-radius:10px;padding:6px 12px;font-size:18px;font-weight:900;display:inline-flex;align-items:center;gap:6px}
.to-item .no{font-size:13px;color:var(--muted)}
.to-item.cur{background:var(--accent);color:#1a1a1a}
.to-item.cur .no{color:#5a4a00}
.to-item.out{opacity:.45;text-decoration:line-through}
.to-arrow{color:var(--muted);font-weight:900}
.turn-now{text-align:center;min-width:300px}
.turn-now .who{font-size:30px;font-weight:900;color:var(--accent)}
.turn-now .who small{font-size:18px;color:var(--text)}
.turn-timer{font-size:54px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.turn-timer.zero{color:var(--danger)}
.reveal{background:#fff;color:#1d1d1f;border-radius:14px;padding:12px 18px;margin-bottom:12px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;animation:pop .3s ease-out}
.reveal .what{font-size:26px;font-weight:900}
.reveal .what .v{display:inline-block;background:#1d1d1f;color:#fff;border-radius:8px;padding:0 10px;margin:0 3px}
.reveal .res{font-size:20px;font-weight:800;flex:1;min-width:300px}
.reveal .res .hit{color:#d9480f}
.reveal .res .miss{color:#868e96}
.reveal .res .out{color:#c92a2a;font-size:24px}
.board-mid{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.ktable{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;flex:1;background:var(--panel);border-radius:12px;padding:8px}
.kc{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:#f4f1e4;color:#1d1d1f;border-radius:5px;font-size:22px;font-weight:900;position:relative}
.kc.blank{background:transparent}
.kc.called{background:#2a3146;color:#59627a}
.kc.just{outline:3px solid var(--hit);animation:blink 1s ease-in-out 3}
@keyframes blink{50%{outline-color:transparent}}
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;width:250px;background:var(--panel);border-radius:12px;padding:8px}
.tc{border-radius:6px;padding:5px 4px;text-align:center;font-size:16px;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.tc.called{background:#2a3146 !important;color:#59627a;text-shadow:none}
.tc.just{outline:3px solid var(--hit);animation:blink 1s ease-in-out 3}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.pbox{background:var(--panel);border-radius:14px;padding:10px 12px;border:3px solid transparent}
.pbox.cur{border-color:var(--accent)}
.pbox.out{opacity:.75}
.pbox.win{border-color:var(--ok)}
.pbox-head{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:900;margin-bottom:8px}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-weight:800;font-size:13px;white-space:nowrap}
.tag.out{background:var(--danger);color:#fff}
.tag.win{background:var(--ok);color:#10301c}
.tag.cur{background:var(--accent);color:#1a1a1a}
.tag.practice{background:#7a4dd8;color:#fff}
.tag.draw{background:#868e96;color:#fff}
.pks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pk{background:var(--panel2);border-radius:10px;padding:8px 6px;text-align:center;min-height:118px;display:flex;flex-direction:column;gap:6px;justify-content:space-between;position:relative}
.pk .slots{display:flex;gap:3px;justify-content:center}
.pk .slots span{flex:0 1 26px;min-width:0;height:34px;display:flex;align-items:center;justify-content:center;background:#3a4560;color:#c9d2e8;border-radius:5px;font-size:21px;font-weight:900}
.pk .slots span.op{background:#fff;color:#1d1d1f}
.pk .slots span.op.just{background:var(--hit);color:#fff}
.turn-now .bonus-lbl{display:inline-block;background:var(--ok);color:#10301c;border-radius:8px;padding:2px 10px;font-weight:900;font-size:16px;margin-top:2px}
.reveal .res .bonus{color:#2b8a3e;font-size:22px}
.pk .nm{font-size:19px;font-weight:900;line-height:1.2;word-break:break-all}
.pk .nm.dim{color:#8790a8}
.pk .letters{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:26px}
.pk .letters span{background:#fff;color:#1d1d1f;border-radius:5px;font-size:17px;font-weight:900;padding:0 5px;line-height:26px}
.pk .letters span.just{background:var(--hit);color:#fff}
.pk .types{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.tchip{border-radius:5px;padding:1px 6px;font-size:13px;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);white-space:nowrap}
.tchip.q{background:#3a4560;text-shadow:none;color:#c9d2e8}
.pk.open{background:#5a1f22}
.pk.open .nm{color:#fff}
.pk .stamp{position:absolute;top:4px;right:4px;background:var(--danger);color:#fff;font-size:11px;font-weight:900;border-radius:4px;padding:0 5px}
.pk.flash{animation:flash 1.2s ease-in-out 2}
@keyframes flash{50%{box-shadow:0 0 0 4px var(--hit)}}
.final-banner{text-align:center;border-radius:14px;padding:16px;margin-bottom:12px;background:linear-gradient(135deg,#1e9b53,#3ccf7a)}
.final-banner.practice{background:linear-gradient(135deg,#5b3bb0,#7a4dd8)}
.final-banner.draw{background:linear-gradient(135deg,#495057,#868e96)}
.final-banner .big{font-size:50px;font-weight:900}

/* ===== ルール説明 ===== */
.rule-display{text-align:left;max-width:1100px;margin:20px auto 28px;line-height:1.7;font-size:22px}
.rule-red{color:#c0392b;background:#f0f0f0;border:1px solid #ddd;padding:1px 7px;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.rule-normal{color:#222}
.rule-display, .rule-display *{color:#fff !important}
.rule-display *:not(.rule-red){background-color:transparent !important}
.rule-display .rule-red, .rule-display .rule-red *{color:#e5342b !important}
.rule-display .rule-red{background:#fff !important;border:none}
.rule-display [style*="font-size"]:not([style*="1.5em"]), .rule-display font[size]{font-size:inherit !important}
.rule-display h1, .rule-display h2, .rule-display h3, .rule-display h4, .rule-display p{font-size:inherit !important;margin:0;font-weight:inherit}
.rule-img{border-radius:8px;margin-bottom:10px;cursor:zoom-in;max-height:50vh}

/* ===== 参加者（スマホ） ===== */
body.sub .page{max-width:520px;padding:10px}
.sub-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:8px}
.role-banner{border-radius:10px;padding:8px 10px;text-align:center;font-size:20px;font-weight:900;margin-bottom:10px;background:var(--accent);color:#1a1a1a}
.role-banner.wait{background:var(--panel2);color:var(--text);font-size:17px}
.role-banner.out{background:var(--danger);color:#fff}
.p-center{text-align:center;padding:30px 16px}
.p-timer{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;text-align:center;margin:6px 0 10px}
.p-timer.zero{color:var(--danger)}
.mypk{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.mypk .m{background:var(--panel);border-radius:10px;padding:8px 4px;text-align:center}
.mypk .m .nm{font-size:16px;font-weight:900;word-break:break-all;margin-bottom:4px}
.mypk .m .types{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.mypk .m{position:relative}
.mypk .m.opened{background:#2a2030;opacity:.55}
.mypk .m.opened .nm{text-decoration:line-through;color:#c9c0d0}
.mypk .m .ostamp{display:inline-block;background:var(--danger);color:#fff;font-size:11px;font-weight:900;border-radius:4px;padding:0 6px;margin-bottom:3px}
.deal{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.deal .d{background:var(--panel);border-radius:12px;padding:14px 6px;text-align:center;border:3px solid transparent;cursor:pointer;user-select:none;position:relative}
.deal .d .nm{font-size:19px;font-weight:900;margin-bottom:6px;word-break:break-all}
.deal .d .types{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.deal .d.on{border-color:var(--accent);background:#3a3417}
.deal .d .ck{position:absolute;top:4px;left:6px;font-size:14px;font-weight:900;color:var(--accent)}
.deal.locked .d{cursor:default}
.deal.locked .d:not(.on){opacity:.35}
.ans-box{background:var(--panel);border-radius:12px;padding:12px;margin-bottom:10px}
.ans-box .lbl{font-size:14px;color:var(--muted);font-weight:800;margin-bottom:6px}
.ans-box select{width:100%;font-size:18px;font-weight:900;padding:8px}
.ans-sels{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ans-or{text-align:center;font-weight:900;color:var(--muted);margin:10px 0}
.tbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.tbtns button{padding:9px 2px;font-size:14px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);border:3px solid transparent}
.tbtns button.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.ans-pick{text-align:center;font-size:18px;font-weight:900;margin:10px 0;min-height:28px}
.ans-pick .v{display:inline-block;background:var(--accent);color:#1a1a1a;border-radius:6px;padding:0 10px;margin:0 2px}
.bottom-btns{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.bottom-btns button{padding:14px;font-size:17px}
.spinner{width:40px;height:40px;border:4px solid #3a4a6b;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== モーダル・トースト ===== */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;color:#1d1d1f;border-radius:14px;padding:20px;max-width:460px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.modal p{margin:6px 0}
.modal .warn{background:#fff0e6;border:2px solid #ff8a3d;border-radius:10px;padding:10px;font-weight:800;color:#b03b00}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.modal button{background:#e3e6ec;color:#1d1d1f}
.modal button.primary{background:var(--accent)}
.modal button.danger{background:var(--danger);color:#fff}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:15px;cursor:pointer}
.chk input{margin-top:3px;transform:scale(1.2)}
.img-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:150}
.img-modal img{max-width:92vw;max-height:92vh}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:200;pointer-events:none;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw}
.toast{background:#222c44;color:#fff;border-radius:12px;padding:10px 18px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:tin .2s ease-out;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* ===== 保存オーバーレイ ===== */
.save-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:300}
.save-overlay.active{display:flex}
.save-box{background:#fff;color:#222;padding:24px 30px;border-radius:12px;text-align:center;min-width:260px}
.save-box .spinner{border-color:#ddd;border-top-color:#e0a800}
.save-bar-outer{background:#eee;border-radius:6px;height:10px;margin-top:10px;overflow:hidden}
.save-bar-inner{background:#e0a800;height:100%;width:0%;transition:width .2s}

/* ===== 管理 ===== */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid #33415f;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:700;white-space:nowrap}
.table-wrap{overflow-x:auto}
.ex-list{display:flex;flex-wrap:wrap;gap:8px}
.ex-item{background:var(--panel2);border-radius:8px;padding:6px 8px 6px 12px;display:inline-flex;align-items:center;gap:8px;font-weight:700}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--panel2);border-radius:12px;padding:12px 14px;text-align:center}
.stat .lbl{font-size:15px;color:var(--muted);font-weight:700}
.stat .val{font-size:40px;font-weight:900}
.set-grid{display:grid;grid-template-columns:200px 1fr;gap:12px 16px;align-items:center}
.set-grid>.lbl{font-weight:800}
.err-text{color:#ff8a8e;font-weight:700;font-size:14px}
.sticky-actions{position:sticky;bottom:0;background:var(--bg);padding:10px 0;z-index:5;border-top:1px solid #2a3654}
.rich-toolbar{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.rich-toolbar button{padding:4px 10px;font-size:13px;border-radius:6px}
.rule-edit{border:1px solid #ccc;border-radius:6px;min-height:70px;padding:10px;background:#fff;color:#222;text-align:left;line-height:1.6}
.rule-slide-card{border:1px solid #33415f;border-radius:10px;padding:10px;margin-bottom:10px;background:#16213a}
.rule-group-block{margin-bottom:10px}
.thumb{max-width:160px;max-height:120px;display:block;border-radius:6px;cursor:zoom-in}
@media (max-width:900px){ .board-mid{flex-direction:column} .tgrid{width:100%;grid-template-columns:repeat(6,1fr)} .kc{font-size:14px} }
@media (max-width:700px){ .stats4{grid-template-columns:repeat(2,1fr)} .set-grid{grid-template-columns:1fr} .order-item{min-width:0;font-size:28px} }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast"></div>
<div class="save-overlay" id="save-overlay"><div class="save-box"><div class="spinner"></div><div id="save-msg">保存中…</div>
  <div style="font-size:22px;font-weight:900" id="save-pct">0%</div><div class="save-bar-outer"><div class="save-bar-inner" id="save-bar"></div></div></div></div>

<script>
/* =========================================================
   ポケモンオープン
   ・パラメータなし     … ホスト画面（PC：QR表示・ルール説明・文字表／タイプ一覧・進行）
   ・?room=XXXX        … 参加者画面（スマホ：ポケモンを選ぶ・自分の番に文字／タイプを選ぶ）
   ・?mode=admin       … 管理ページ（制限時間・ルール説明・履歴・除外・ポケモンリスト）
   ========================================================= */
const GAME_TITLE = 'ポケモンオープン';
const ROOM_PREFIX = 'pkopen-';
const MIN_PLAYERS = 2;
const DEAL_N = 6, KEEP_N = 3;

/* ---------- 共通ユーティリティ ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function lsGet(k, def){ try{ const v=localStorage.getItem(k); return v==null?def:JSON.parse(v); }catch(e){ return def; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ alert('ブラウザへの保存に失敗しました'); } }
function fmtDate(t){ const d=new Date(t), p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function stripHtml(h){ return String(h||'').replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').trim(); }
function toInt(v){ const s=String(v==null?'':v).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).trim(); return /^-?\d+$/.test(s) ? parseInt(s,10) : NaN; }
function typeChip(t){ return `<span class="tchip" style="background:${TYPE_COLORS[t]||'#555'}">${esc(t)}</span>`; }
function typeChips(ts){ return (ts||[]).map(typeChip).join(''); }

function openModal(html, buttons){
  const wrap=document.createElement('div');
  wrap.className='modal-bg';
  wrap.innerHTML=`<div class="modal">${html}<div class="modal-btns"></div></div>`;
  const close=()=>wrap.remove();
  (buttons||[{label:'閉じる'}]).forEach(b=>{
    const el=document.createElement('button');
    el.textContent=b.label; if(b.cls) el.className=b.cls;
    el.onclick=()=>{ if(b.onClick && b.onClick()===false) return; close(); };
    wrap.querySelector('.modal-btns').appendChild(el);
  });
  document.getElementById('modal-root').appendChild(wrap);
  return {el:wrap, close};
}
function closeAllModals(){ document.getElementById('modal-root').innerHTML=''; }
function showToast(text, ms){
  const el=document.createElement('div'); el.className='toast'; el.textContent=text;
  document.getElementById('toast').appendChild(el);
  setTimeout(()=>el.remove(), ms||2400);
}
/* 画像タップで全画面表示（背景クリックで閉じる） */
document.addEventListener('click', e=>{
  if(e.target.tagName==='IMG' && e.target.closest('.rule-img,.thumb')){
    const m=document.createElement('div'); m.className='img-modal';
    m.innerHTML=`<img src="${e.target.src}">`; m.onclick=()=>m.remove();
    document.body.appendChild(m);
  }
});

let wakeLock=null;
async function requestWakeLock(){ try{ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{wakeLock=null;}); }catch(e){} }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && !wakeLock && MODE!=='admin') requestWakeLock(); });

/* ---------- 判定 ---------- */
/** その文字がオープンされているか（文字表にない文字は最初からオープン扱い） */
function charOpen(c, chars){ return !TABLE_SET.has(c) || chars.includes(c); }
/** 名前がすべてオープンされたか */
function nameOpen(name, chars){ return [...name].every(c=>charOpen(c, chars)); }
/** オープンされた文字（名前の中の順・同じ文字は1回だけ） */
function openedLetters(name, chars){ const seen=new Set(), out=[]; [...name].forEach(c=>{ if(TABLE_SET.has(c) && chars.includes(c) && !seen.has(c)){ seen.add(c); out.push(c); } }); return out; }
function pkHas(pk, kind, v){ return kind==='type' ? pk.t.includes(v) : pk.n.includes(v); }

function mergeAppData(d){
  const m=Object.assign(defaultAppData(), d||{});
  if(!Array.isArray(m.ruleSlides)||!m.ruleSlides.length) m.ruleSlides=JSON.parse(JSON.stringify(DEFAULT_RULE_SLIDES));
  const txt=JSON.stringify(m.ruleSlides.map(s=>s.img?null:(s.groups||[]).map(g=>stripHtml(g).replace(/\s+/g,' '))));
  if(OLD_DEFAULT_RULE_TEXTS.some(o=>JSON.stringify([o])===txt)) m.ruleSlides=JSON.parse(JSON.stringify(DEFAULT_RULE_SLIDES));
  m.ruleSlides.forEach(s=>{ if(!Array.isArray(s.groups)||!s.groups.length) s.groups=['']; if(s.img===undefined) s.img=null; });
  m.settings=normalizeSettings(m.settings);
  if(typeof m.memo!=='string') m.memo='';
  return m;
}

/* ---------- IndexedDB（管理データ） ---------- */
function openDb(){ return new Promise((res,rej)=>{ const r=indexedDB.open(DB_NAME,1); r.onupgradeneeded=()=>r.result.createObjectStore(STORE); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(){ const db=await openDb(); return new Promise((res,rej)=>{ const rq=db.transaction(STORE,'readonly').objectStore(STORE).get(DATA_KEY); rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error); }); }
async function idbSet(v){ const db=await openDb(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).put(v,DATA_KEY); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
let appData=defaultAppData();
async function loadAppData(){ try{ appData=mergeAppData(await idbGet()); }catch(e){ appData=defaultAppData(); } }

/* ---------- ポケモンリスト・使用状況・除外（3-8 お題プール管理） ---------- */
function toPk(a){ return { n:String(a[0]||'').trim(), t:[a[1],a[2]].map(x=>String(x||'').trim()).filter(Boolean) }; }
function getItemList(){
  const w=lsGet(LS.items, null);
  const list = Array.isArray(w)&&w.length ? w : DEFAULT_ITEMS;
  const seen=new Set(), out=[];
  list.forEach(a=>{ if(!Array.isArray(a)) return; const p=toPk(a); if(!p.n || seen.has(p.n)) return; seen.add(p.n); out.push(p); });
  return out;
}
function getUsed(){ return new Set(lsGet(LS.used, [])); }
function setUsed(s){ lsSet(LS.used, [...s]); }
function getExcluded(){ return new Set(lsGet(LS.excluded, [])); }
function setExcluded(s){ lsSet(LS.excluded, [...s]); }
function getHistory(){ return lsGet(LS.history, []); }
function setHistory(h){ lsSet(LS.history, h); }
function availablePool(skip){
  const used=getUsed(), ex=getExcluded(), sk=new Set(skip||[]);
  return getItemList().filter(p=>!used.has(p.n) && !ex.has(p.n) && !sk.has(p.n));
}
function usableCount(){ const ex=getExcluded(); return getItemList().filter(p=>!ex.has(p.n)).length; }
/** n匹を重複なしで選んで使用済みにする（足りない時は使用状況のリセットを確認）。キャンセル時は null */
function pickItems(n){
  let pool=availablePool([]), first=[];
  if(pool.length<n){
    if(usableCount() < n){ alert(`ポケモンが足りません（${n}匹必要・除外を除いて${usableCount()}匹）。管理ページで除外リストやポケモンリストを確認してください。`); return null; }
    if(!confirm(`未使用のポケモンが残り${pool.length}匹しかありません（${n}匹必要）。\n使用状況をリセットしますか？\n（残りを先に使い、足りない分をリセット後から選びます）`)) return null;
    first=shuffle(pool); setUsed(new Set());
    pool=availablePool(first.map(p=>p.n));
  }
  const picked=first.concat(shuffle(pool).slice(0, n-first.length));
  const used=getUsed(); picked.forEach(p=>used.add(p.n)); setUsed(used);
  return shuffle(picked);
}

   ホスト画面
   ========================================================= */
let gs=null, peer=null, myHostId=null;
const conns={};             // pid -> conn
const connected=new Set();  // 接続中の pid
let tickTimer=null, orderAnimTimer=null, beepedId=null, audioCtx=null;

function freshState(){
  return { phase:'lobby', players:{}, order:[], gameCount:0, ruleSlideIndex:0, ruleRevealIndex:0,
           pendingPractice:false, settings:null, game:null };
}
function S(){ return gs.settings || appData.settings; }
function G(){ return gs.game; }
function genRoomId(){ return ROOM_PREFIX + String(Math.floor(100000+Math.random()*900000)); }
function joinUrl(){ return myHostId ? location.origin+location.pathname+'?room='+encodeURIComponent(myHostId) : ''; }
function pname(pid){ const p=gs.players[pid]; return p?p.name:'（退出）'; }
function connectedPids(){ return gs.order.filter(pid=>gs.players[pid] && connected.has(pid)); }
function inGamePhase(){ return ['select','order','turn','reveal'].includes(gs.phase); }
function nextLabel(practice){ return practice ? '例題' : `第${gs.gameCount+1}ゲーム`; }
function alivePids(g){ g=g||G(); return g.turnOrder.filter(p=>!g.out.includes(p)); }

async function initHost(){
  requestWakeLock();
  await loadAppData();
  const saved=lsGet(LS.state,null), room=lsGet(LS.room,null);
  const resumable = saved && room && (saved.phase!=='lobby' || Object.keys(saved.players||{}).length);
  if(resumable && confirm('前回の続きから再開しますか？\n\nOK：続きから再開（同じQRのまま）\nキャンセル：新しい部屋を作る')){
    gs=Object.assign(freshState(), saved);
    // 中断中に過ぎた時間はやり直し（再開した時点から数え直す）
    const g=G();
    if(g && gs.phase==='select') g.selEndsAt=Date.now()+S().selectSec*1000;
    if(g && gs.phase==='turn' && g.turn){ g.turn.endsAt=Date.now()+g.turn.durMs; }
    startPeer(room, 0);
  } else {
    localStorage.removeItem(LS.state); localStorage.removeItem(LS.room);
    gs=freshState();
    startPeer(null, 0);
  }
  document.getElementById('app').addEventListener('click', onHostClick);
  document.addEventListener('keydown', e=>{
    if(e.key!=='Enter' || document.querySelector('.modal-bg')) return;
    const b=document.querySelector('[data-enter]'); if(b && !b.disabled){ e.preventDefault(); b.click(); }
  });
  tickTimer=setInterval(tickHost, 200);
  renderHost();
}
function startPeer(roomId, retry){
  const id=roomId||genRoomId();
  if(peer){ try{ peer.destroy(); }catch(e){} }
  peer=new Peer(id);
  peer.on('open', pid=>{ myHostId=pid; lsSet(LS.room, pid); saveState(); renderHost(); });
  peer.on('connection', conn=>{
    conn.on('data', data=>handleSubMessage(conn, data));
    conn.on('close', ()=>{
      const pid=conn._pid;
      if(pid && conns[pid]===conn){ delete conns[pid]; connected.delete(pid); renderHost(); }
    });
  });
  peer.on('error', err=>{
    if(err && err.type==='unavailable-id'){
      if(roomId && retry<5){ setTimeout(()=>startPeer(roomId, retry+1), 3000); }
      else { showToast('部屋番号を新しくしました。スマホはQRから入り直してください', 5000); startPeer(null, 0); }
    } else { console.error(err); }
  });
  peer.on('disconnected', ()=>{ try{ peer.reconnect(); }catch(e){} });
}
function saveState(){ lsSet(LS.state, gs); }
function commit(){ saveState(); syncAll(); renderHost(); }
function sendTo(pid, msg){ const c=conns[pid]; if(c && c.open){ try{ c.send(msg); }catch(e){} } }
function syncAll(){ Object.keys(conns).forEach(pid=>sendTo(pid, snapshotFor(pid))); }

/** 参加者に送る画面情報（参加者は毎回これで上書きするだけ） */
function snapshotFor(pid){
  const g=G(), ph=gs.phase;
  const snap={ type:'state', title:GAME_TITLE, phase:ph, name:pname(pid), member:false, gameId:null };
  if(!g || ph==='lobby' || ph==='rule') return snap;
  const h=g.hands[pid];
  Object.assign(snap, { gameId:g.id, label:g.label, practice:g.practice, member:!!h,
    calledChars:g.called.chars, calledTypes:g.called.types,
    orderNames: ph==='select' ? [] : g.turnOrder.map(pname) });
  if(h){
    snap.out=g.out.includes(pid);
    if(ph==='select'){ snap.deal=h.deal; snap.picks=h.picks; snap.confirmed=h.confirmed; snap.remainingMs=Math.max(0,g.selEndsAt-Date.now()); }
    else snap.mine=h.final;
  }
  if(ph==='turn' && g.turn){
    snap.turn={ id:g.turn.id, name:pname(g.turn.pid), isMe:g.turn.pid===pid, bonus:!!g.turn.bonus, remainingMs:Math.max(0,g.turn.endsAt-Date.now()) };
  }
  if(ph==='reveal' && g.lastResult) snap.lastName=g.lastResult.name;
  if(ph==='end') snap.result={ draw:g.draw, winnerNames:g.winners.map(pname), practice:g.practice };
  return snap;
}
function remapPid(oldP, newP){
  gs.order=gs.order.map(p=>p===oldP?newP:p);
  const g=G(); if(!g) return;
  if(g.hands[oldP]){ g.hands[newP]=g.hands[oldP]; delete g.hands[oldP]; }
  g.members=g.members.map(p=>p===oldP?newP:p);
  g.turnOrder=g.turnOrder.map(p=>p===oldP?newP:p);
  g.out=g.out.map(p=>p===oldP?newP:p);
  g.winners=g.winners.map(p=>p===oldP?newP:p);
  if(g.turn && g.turn.pid===oldP) g.turn.pid=newP;
  if(g.lastResult && g.lastResult.pid===oldP) g.lastResult.pid=newP;
}
function handleSubMessage(conn, data){
  if(!data || !data.type) return;
  if(data.type==='join'){
    let pid=String(data.pid||''); const name=String(data.name||'').trim().slice(0,12);
    if(!pid || !name) return;
    if(!gs.players[pid]){
      // タブを閉じて入り直した人：同じニックネームで切断中の人がいれば、その人として復帰
      const same=gs.order.find(p=>gs.players[p] && gs.players[p].name===name);
      if(same && !connected.has(same)){
        gs.players[pid]=gs.players[same]; delete gs.players[same];
        remapPid(same, pid);
      } else if(same){ try{ conn.send({type:'name_taken'}); }catch(e){} return; }
      else { gs.players[pid]={name}; gs.order.push(pid); }
    } else {
      if(gs.order.some(p=>p!==pid && gs.players[p] && gs.players[p].name===name)){ try{ conn.send({type:'name_taken'}); }catch(e){} return; }
      gs.players[pid].name=name;
    }
    const old=conns[pid];
    conn._pid=pid; conns[pid]=conn; connected.add(pid);
    if(old && old!==conn){ try{ old.close(); }catch(e){} }
    commit();
    return;
  }
  const pid=conn._pid; if(!pid || !gs.players[pid]) return;
  const g=G();
  if(data.type==='pick'){
    if(gs.phase!=='select' || !g || data.gameId!==g.id) return;
    const h=g.hands[pid]; if(!h || h.confirmed) return;
    const picks=[...new Set((data.picks||[]).map(Number))].filter(i=>i>=0 && i<h.deal.length).slice(0,KEEP_N);
    h.picks=picks;
    if(data.confirm && picks.length===KEEP_N){ h.confirmed=true; h.final=picks.map(i=>h.deal[i]); }
    if(g.members.every(p=>g.hands[p].confirmed)) finishSelect();
    else commit();
    return;
  }
  if(data.type==='answer'){
    if(gs.phase!=='turn' || !g || !g.turn || g.turn.pid!==pid || data.turnId!==g.turn.id) return;
    const kind=data.kind==='type'?'type':'chars';
    if(g.turn.bonus && kind!=='chars'){ sendTo(pid,{type:'toast', text:'追加の行動では文字を1つだけ選べます'}); return; }
    let vals=[...new Set((data.vals||[]).map(String))];
    if(kind==='type') vals=vals.filter(v=>TYPES.includes(v) && !g.called.types.includes(v)).slice(0,1);
    else vals=vals.filter(v=>TABLE_SET.has(v) && !g.called.chars.includes(v)).slice(0, g.turn.bonus?1:2);
    if(!vals.length){ sendTo(pid,{type:'toast', text:'その回答は選べません。選び直してください'}); return; }
    applyAnswer(kind, vals);
  }
}

/* ----- 進行 ----- */
function beginGame(practice, withRule){
  if(connectedPids().length<MIN_PLAYERS){ alert(`参加者が${MIN_PLAYERS}人以上必要です`); return; }
  loadAppData().then(()=>{
    gs.settings=JSON.parse(JSON.stringify(appData.settings));   // ゲーム中は開始時点の設定で固定
    const hasRule=appData.ruleSlides.some(s=>s.img || s.groups.some(g=>stripHtml(g)));
    if(withRule && hasRule){ gs.pendingPractice=practice; gs.game=null; gs.phase='rule'; gs.ruleSlideIndex=0; gs.ruleRevealIndex=0; commit(); }
    else dealGame(practice);
  });
}
/** 6匹ずつ配る（参加者どうしで重複なし）→ ポケモン選択へ */
function dealGame(practice){
  const members=connectedPids();
  if(members.length<MIN_PLAYERS){ alert(`接続中の参加者が${MIN_PLAYERS}人以上必要です`); return false; }
  const items=pickItems(members.length*DEAL_N);
  if(!items) return false;
  const hands={};
  members.forEach((p,i)=>{ hands[p]={ deal:items.slice(i*DEAL_N,(i+1)*DEAL_N), picks:[], confirmed:false, final:null }; });
  gs.game={ id:uid(), practice, label:nextLabel(practice), members, hands,
            selEndsAt:Date.now()+S().selectSec*1000,
            turnOrder:[], orderShown:0, turnIdx:0, turn:null,
            called:{chars:[], types:[]}, log:[], lastResult:null, out:[], winners:[], draw:false,
            words:items.map(p=>p.n), startedAt:Date.now() };
  gs.phase='select';
  commit();
  return true;
}
function advanceRule(){
  const slides=appData.ruleSlides, slide=slides[gs.ruleSlideIndex];
  if(gs.ruleRevealIndex < slide.groups.length-1){ gs.ruleRevealIndex++; commit(); }
  else if(gs.ruleSlideIndex < slides.length-1){ gs.ruleSlideIndex++; gs.ruleRevealIndex=0; commit(); }
  else dealGame(gs.pendingPractice);
}
function retreatRule(){
  const slides=appData.ruleSlides;
  if(gs.ruleRevealIndex>0) gs.ruleRevealIndex--;
  else if(gs.ruleSlideIndex>0){ gs.ruleSlideIndex--; gs.ruleRevealIndex=slides[gs.ruleSlideIndex].groups.length-1; }
  commit();
}
/** 選択終了：確定していない人は、選んでいる分はそのまま・足りない分を残りからランダムで選ぶ → 回答順の発表へ */
function finishSelect(){
  const g=G(); if(!g || gs.phase!=='select') return;
  g.members.forEach(p=>{
    const h=g.hands[p]; if(h.confirmed) return;
    const rest=shuffle([...Array(h.deal.length).keys()].filter(i=>!h.picks.includes(i)));
    h.picks=h.picks.concat(rest.slice(0, KEEP_N-h.picks.length));
    h.final=h.picks.map(i=>h.deal[i]); h.confirmed=true; h.auto=true;
  });
  g.turnOrder=shuffle(g.members);
  g.orderShown=0;
  gs.phase='order';
  commit();
  playOrderAnim();
}
function playOrderAnim(){
  clearInterval(orderAnimTimer);
  orderAnimTimer=setInterval(()=>{
    const g=G();
    if(!g || gs.phase!=='order' || g.orderShown>=g.turnOrder.length){ clearInterval(orderAnimTimer); orderAnimTimer=null; return; }
    g.orderShown++; commit();
  }, 900);
}
/** bonus=true：正解したあとの追加の行動（文字1つだけ） */
function beginTurn(bonus){
  const g=G(), sec=S().answerSec;
  g.turn={ id:uid(), pid:g.turnOrder[g.turnIdx], endsAt:Date.now()+sec*1000, durMs:sec*1000, bonus:!!bonus };
  g.lastResult=null;
  gs.phase='turn';
  commit();
}
function startTurns(){
  const g=G(); if(gs.phase!=='order') return;
  g.turnIdx=0; beginTurn();
}
/** 回答を反映：誰かのポケモンに含まれていればオープン。名前が3匹ともオープンされた人は負け */
function applyAnswer(kind, vals){
  const g=G(), t=g.turn, pid=t.pid;
  if(t.bonus){ kind='chars'; vals=vals.slice(0,1); }
  const wasOpen={};
  g.members.forEach(p=>{ wasOpen[p]=g.hands[p].final.map(pk=>nameOpen(pk.n, g.called.chars)); });
  if(kind==='type') g.called.types.push(...vals); else g.called.chars.push(...vals);
  const all=[]; g.members.forEach(p=>g.hands[p].final.forEach((pk,i)=>all.push({p,i,pk})));
  const hits=vals.map(v=>({ v, count:all.filter(x=>pkHas(x.pk, kind, v)).length }));
  const flashes=all.filter(x=>vals.some(v=>pkHas(x.pk, kind, v))).map(x=>x.p+':'+x.i);
  const opened=[];
  g.members.forEach(p=>g.hands[p].final.forEach((pk,i)=>{ if(!wasOpen[p][i] && nameOpen(pk.n, g.called.chars)) opened.push({owner:pname(p), n:pk.n}); }));
  const newOut=g.members.filter(p=>!g.out.includes(p) && g.hands[p].final.every(pk=>nameOpen(pk.n, g.called.chars)));
  g.out.push(...newOut);
  // 正解＝ほかの人のポケモンに1つでも含まれていた → もう1回だけ文字を1つ選べる（追加の行動では続かない）
  const correct=all.some(x=>x.p!==pid && vals.some(v=>pkHas(x.pk, kind, v)));
  g.lastResult={ pid, name:pname(pid), kind, vals, hits, flashes, opened, outNames:newOut.map(pname), skipped:false, wasBonus:!!t.bonus, correct, bonus:false };
  g.log.push({ name:pname(pid), kind, vals, bonus:!!t.bonus });
  g.turn=null;
  checkOver(newOut);
  g.lastResult.bonus = correct && !t.bonus && !g.over && !g.out.includes(pid);
  gs.phase='reveal';
  commit();
}
function skipTurn(reason){
  const g=G(), t=g.turn; if(!t) return;
  g.lastResult={ pid:t.pid, name:pname(t.pid), kind:null, vals:[], hits:[], flashes:[], opened:[], outNames:[], skipped:true, reason, wasBonus:!!t.bonus, bonus:false };
  g.log.push({ name:pname(t.pid), kind:null, vals:[] });
  g.turn=null;
  gs.phase='reveal';
  commit();
}
function checkOver(newOut){
  const g=G(), alive=alivePids(g);
  if(alive.length>1) return;
  g.over=true;
  if(alive.length===1){ g.winners=alive; g.draw=false; }
  else { g.winners=newOut.slice(); g.draw=true; }   // 最後の人たちが同時に負けた → 引き分け
}
function nextTurn(){
  const g=G(); if(gs.phase!=='reveal') return;
  if(g.over){ finishGame(); return; }
  if(g.lastResult && g.lastResult.bonus){ beginTurn(true); return; }   // 同じ人がもう1回（文字1つ）
  const n=g.turnOrder.length;
  for(let k=1;k<=n;k++){
    const idx=(g.turnIdx+k)%n;
    if(!g.out.includes(g.turnOrder[idx])){ g.turnIdx=idx; break; }
  }
  beginTurn();
}
function finishGame(){
  const g=G();
  gs.phase='end';
  if(!g.practice){
    gs.gameCount++;
    const h=getHistory();
    h.push({ id:uid(), at:Date.now(), label:g.label, players:g.members.map(pname), winners:g.winners.map(pname), draw:!!g.draw,
             turns:g.log.length, words:g.words.slice() });
    setHistory(h);
  }
  commit();
}
function abortGame(){
  if(!confirm('このゲームを中止しますか？\n（勝ち負けは記録されません。参加者画面に戻ります）')) return;
  gs.game=null; gs.phase='lobby'; commit();
}
function startHonbanNow(){
  if(!confirm('例題を終えて、本番（第1ゲーム）を始めますか？\n（新しくポケモンが配られます）')) return;
  loadAppData().then(()=>{ gs.settings=JSON.parse(JSON.stringify(appData.settings)); dealGame(false); });
}

/* ----- タイマー（画面全体は描き直さず数字だけ更新・時間切れの処理） ----- */
function beep(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    [0,0.35,0.7].forEach(off=>{
      const o=audioCtx.createOscillator(), gn=audioCtx.createGain();
      o.frequency.value=880; o.connect(gn); gn.connect(audioCtx.destination);
      const t=audioCtx.currentTime+off; gn.gain.setValueAtTime(0.25,t); gn.gain.exponentialRampToValueAtTime(0.001,t+0.3);
      o.start(t); o.stop(t+0.3);
    });
  }catch(e){}
}
function tickHost(){
  const g=gs && G(); if(!g) return;
  let endsAt=null, id=null;
  if(gs.phase==='select'){ endsAt=g.selEndsAt; id='sel-'+g.id; }
  else if(gs.phase==='turn' && g.turn){ endsAt=g.turn.endsAt; id=g.turn.id; }
  if(endsAt==null) return;
  const ms=Math.max(0, endsAt-Date.now());
  const el=document.getElementById('host-timer');
  if(el){ el.innerHTML=`${Math.ceil(ms/1000)}<span class="unit">秒</span>`; el.classList.toggle('zero', ms<=0); }
  if(ms<=0 && beepedId!==id){
    beepedId=id; beep();
    if(gs.phase==='select') finishSelect();
    else skipTurn('timeout');
  }
}

function openQrModal(){
  if(!myHostId){ showToast('部屋を準備中です'); return; }
  const m=openModal(`<h3>参加用QRコード</h3><div style="text-align:center"><div class="qrbox" id="qr-modal"></div><div class="url" style="color:#666">${esc(joinUrl())}</div></div>`);
  new QRCode(m.el.querySelector('#qr-modal'), {text:joinUrl(), width:260, height:260});
}
function kickPlayer(pid){
  if(!gs.players[pid] || !confirm(`${pname(pid)}さんを参加者から外しますか？`)) return;
  sendTo(pid, {type:'removed'});
  const c=conns[pid]; delete conns[pid]; connected.delete(pid);
  delete gs.players[pid];
  gs.order=gs.order.filter(p=>p!==pid);
  setTimeout(()=>{ try{ c&&c.close(); }catch(err){} }, 300);
  commit();
}

function onHostClick(e){
  const b=e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  const act=b.dataset.act;
  try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }catch(err){}
  const withRule=()=>{ const c=document.getElementById('chk-rule'); return c ? c.checked : false; };
  if(act==='qr') openQrModal();
  else if(act==='admin'){ if(gs.phase==='lobby' || confirm('管理ページを開きますか？\n（ゲームの進行状況は保存されます。戻ると「続きから再開」できます）')) location.href=location.pathname+'?mode=admin'; }
  else if(act==='newroom'){
    if(!confirm('新しい部屋を作り直しますか？\n（今の進行状況は消え、スマホはQRから入り直しになります）')) return;
    localStorage.removeItem(LS.state); localStorage.removeItem(LS.room);
    location.reload();
  }
  else if(act==='kick') kickPlayer(b.dataset.pid);
  else if(act==='start-practice') beginGame(true, withRule());
  else if(act==='start-honban') beginGame(false, withRule());
  else if(act==='rule-next') advanceRule();
  else if(act==='rule-prev') retreatRule();
  else if(act==='rule-skip') dealGame(gs.pendingPractice);
  else if(act==='sel-end'){ if(confirm('ポケモン選択を締め切りますか？\n（確定していない人は、選んでいる分はそのまま・足りない分をランダムで選びます）')) finishSelect(); }
  else if(act==='turns') startTurns();
  else if(act==='skip'){ if(confirm(`${pname(G().turn.pid)}さんの番をスキップしますか？（何も選ばずに次の人へ）`)) skipTurn('host'); }
  else if(act==='next') nextTurn();
  else if(act==='abort') abortGame();
  else if(act==='honban-now') startHonbanNow();
  else if(act==='next-game'){ loadAppData().then(()=>{ gs.settings=JSON.parse(JSON.stringify(appData.settings)); dealGame(b.dataset.practice==='1'); }); }
  else if(act==='to-lobby'){ gs.game=null; gs.phase='lobby'; commit(); }
}

/* ----- 盤面（文字表・タイプ一覧・各参加者のポケモン） ----- */
/* 使われた文字・タイプは、当たり外れに関係なくすべてグレーアウト */
function charStat(g, c){ return g.called.chars.includes(c) ? 'called' : ''; }
function typeStat(g, t){ return g.called.types.includes(t) ? 'called' : ''; }
function kanaTableHtml(g, just){
  const cells=[];
  for(let r=0;r<5;r++){
    for(let ci=TABLE_COLS.length-1; ci>=0; ci--){
      const c=TABLE_COLS[ci][r]||'　';
      if(c==='　'){ cells.push('<div class="kc blank"></div>'); continue; }
      cells.push(`<div class="kc ${charStat(g,c)} ${just.includes(c)?'just':''}">${esc(c)}</div>`);
    }
  }
  return `<div class="ktable">${cells.join('')}</div>`;
}
function typeGridHtml(g, just){
  return `<div class="tgrid">${TYPES.map(t=>`<div class="tc ${typeStat(g,t)} ${just.includes(t)?'just':''}" style="background:${TYPE_COLORS[t]}">${esc(t)}</div>`).join('')}</div>`;
}
/** ホスト画面のポケモン1匹：名前は常に「？」6個（文字数は分からない）。オープンした文字はその位置に出す。タイプは数だけ「タイプ？」を並べる */
function pkCardHost(g, pk, key, showAll, just){
  const chars=g.called.chars, open=nameOpen(pk.n, chars);
  const flash=g.lastResult && gs.phase==='reveal' && g.lastResult.flashes.includes(key);
  if(open || showAll){
    return `<div class="pk ${open?'open':''} ${flash?'flash':''}">${open?'<span class="stamp">OPEN</span>':''}
      <div class="nm ${open?'':'dim'}">${esc(pk.n)}</div><div class="types">${typeChips(pk.t)}</div></div>`;
  }
  const name=[...pk.n], slots=[];
  for(let i=0;i<Math.max(NAME_SLOTS, name.length);i++){
    const c=name[i];
    if(c!=null && TABLE_SET.has(c) && chars.includes(c)) slots.push(`<span class="op ${just.includes(c)?'just':''}">${esc(c)}</span>`);
    else if(c!=null && !TABLE_SET.has(c)) slots.push(`<span class="op">${esc(c)}</span>`);
    else slots.push('<span>？</span>');
  }
  const types=pk.t.map(t=>g.called.types.includes(t) ? typeChip(t) : '<span class="tchip q">タイプ？</span>').join('');
  return `<div class="pk ${flash?'flash':''}"><div class="slots">${slots.join('')}</div>
    <div class="types">${types}</div></div>`;
}
function playersHtml(g, showAll){
  const just = g.lastResult && gs.phase==='reveal' ? g.lastResult.vals : [];
  const cur = gs.phase==='turn' && g.turn ? g.turn.pid : null;
  const ordered = g.turnOrder.length ? g.turnOrder : g.members;
  return `<div class="players">${ordered.map(p=>{
    const isOut=g.out.includes(p), isWin=gs.phase==='end' && g.winners.includes(p);
    return `<div class="pbox ${p===cur?'cur':''} ${isOut?'out':''} ${isWin?'win':''}">
      <div class="pbox-head"><span class="dot ${connected.has(p)?'on':''}"></span>${esc(pname(p))}
        ${p===cur?'<span class="tag cur">回答中</span>':''}
        ${isWin?`<span class="tag ${g.draw?'draw':'win'}">${g.draw?'引き分け':'🏆 勝ち'}</span>`:''}
        ${isOut && !isWin?'<span class="tag out">負け</span>':''}</div>
      <div class="pks">${g.hands[p].final.map((pk,i)=>pkCardHost(g, pk, p+':'+i, showAll, just)).join('')}</div>
    </div>`; }).join('')}</div>`;
}
function turnBarHtml(g){
  const cur = gs.phase==='turn' && g.turn ? g.turn.pid : null;
  const items=g.turnOrder.map((p,i)=>`<span class="to-item ${p===cur?'cur':''} ${g.out.includes(p)?'out':''}"><span class="no">${i+1}</span>${esc(pname(p))}</span>`).join('<span class="to-arrow">→</span>');
  let right='';
  if(gs.phase==='turn' && g.turn){
    const ms=Math.max(0, g.turn.endsAt-Date.now());
    right=`<div class="turn-now"><div class="who">${esc(pname(g.turn.pid))}<small> さんの番</small></div>
      ${g.turn.bonus?'<div class="bonus-lbl">⭕ もう1回！（文字を1つだけ）</div>':''}
      <div class="turn-timer timer ${ms<=0?'zero':''}" id="host-timer" style="font-size:54px;margin:4px 0">${Math.ceil(ms/1000)}<span class="unit" style="font-size:20px">秒</span></div>
      <button class="small ghost" data-act="skip">⏭ スキップ</button></div>`;
  }
  return `<div class="turnbar"><div class="turn-order"><span class="lbl">回答順</span>${items}</div>${right}</div>`;
}
function revealHtml(g){
  const x=g.lastResult; if(!x) return '';
  let what, res;
  if(x.skipped){
    what=`${esc(x.name)} さん`;
    res=`<span class="miss">${x.reason==='host'?'スキップしました':'⏰ 時間切れ！ 何も選ばずに次の人へ'}</span>`;
  } else {
    what=`${esc(x.name)} さん${x.wasBonus?'（もう1回）':''}：${x.vals.map(v=>`<span class="v">${esc(v)}</span>`).join('')}${x.kind==='type'?' タイプ':''}`;
    res=x.hits.map(h=>h.count?`<span class="hit">「${esc(h.v)}」ヒット！（${h.count}匹）</span>`:`<span class="miss">「${esc(h.v)}」は誰も持っていません</span>`).join('　');
    if(x.opened.length) res+=`<div>${x.opened.map(o=>`🎯 ${esc(o.owner)}さんの「${esc(o.n)}」が全部オープン！`).join('<br>')}</div>`;
    if(x.outNames.length) res+=`<div class="out">💥 ${x.outNames.map(esc).join('さん・')}さん 負け！</div>`;
    if(x.bonus) res+=`<div class="bonus">⭕ 正解！ ${esc(x.name)}さんは、もう1回だけ文字を1つ選べます</div>`;
  }
  return `<div class="reveal"><div class="what">${what}</div><div class="res">${res}</div>
    <button class="primary big" data-act="next" data-enter>${g.over?'🏆 結果発表 ▶':x.bonus?`▶ ${esc(x.name)}さん もう1回（文字1つ）`:'次の人へ ▶'}</button></div>`;
}

   参加者画面（スマホ）

let myPeer=null, myConn=null, myPid='', myName='', sub=null, removedByHost=false, subTimerEnds=null, subTick=null;
let lastModalKey=null;
let subPick={gameId:null, picks:[]};                 // ポケモン選択（自分の画面の選択状態）
let subAns={turnId:null, c1:'', c2:'', type:'', sent:false};   // 自分の番の回答（決定を押すまでは送らない）

function initSub(){
  requestWakeLock();
  myPid=sessionStorage.getItem(SS_PID) || uid();
  sessionStorage.setItem(SS_PID, myPid);
  myName=sessionStorage.getItem(SS_NAME) || '';
  renderConnecting();
  subTick=setInterval(tickSubTimer, 250);
  myPeer=new Peer();
  myPeer.on('open', ()=>connectToHost(params.get('room')));
  myPeer.on('disconnected', ()=>{ try{ myPeer.reconnect(); }catch(e){} });
  myPeer.on('error', err=>console.error(err));
  document.getElementById('app').addEventListener('click', onSubClick);
  document.getElementById('app').addEventListener('change', onSubChange);
}
function connectToHost(roomId){
  let timer=null;
  const retry=()=>{ if(removedByHost) return; clearTimeout(timer); timer=setTimeout(tryConnect, 3000); };
  function tryConnect(){
    if(removedByHost) return;
    try{
      const conn=myPeer.connect(roomId, {reliable:true});
      myConn=conn;
      conn.on('open', ()=>{ if(myName) sendJoin(); else renderNameForm(''); });
      conn.on('data', handleHostMessage);
      conn.on('close', ()=>{ if(myConn===conn){ renderConnecting(); retry(); } });
      conn.on('error', ()=>{ if(myConn===conn) retry(); });
      setTimeout(()=>{ if(myConn===conn && !conn.open){ try{ conn.close(); }catch(e){} retry(); } }, 8000);
    }catch(e){ retry(); }
  }
  tryConnect();
}
function sendHost(msg){ if(myConn && myConn.open){ try{ myConn.send(msg); return true; }catch(e){} } showToast('通信が切れています。再接続をお待ちください'); return false; }
function sendJoin(){ sendHost({type:'join', pid:myPid, name:myName}); }
function renderConnecting(){
  document.getElementById('app').innerHTML=`<div class="page"><div class="p-center"><div class="spinner"></div>
    <p>ホスト画面に接続しています…</p><p class="muted" style="font-size:13px">つながらない場合はそのまま少しお待ちください（自動で再接続します）</p></div></div>`;
}
function renderNameForm(err){
  document.getElementById('app').innerHTML=`<div class="page"><div class="p-center">
    <h2>${esc(GAME_TITLE)}</h2>
    <p>ニックネームを入力してください</p>
    ${err?`<p style="color:var(--danger)">${esc(err)}</p>`:''}
    <input type="text" id="nick" maxlength="12" placeholder="ニックネーム（12文字まで）" value="${esc(myName)}">
    <div style="margin-top:14px"><button class="primary" id="btn-join" style="width:100%;padding:14px;font-size:17px">参加する</button></div>
    <p class="muted" style="font-size:13px">途中で画面を閉じてしまった場合は、同じニックネームで入り直すと復帰できます</p>
  </div></div>`;
  document.getElementById('btn-join').onclick=()=>{
    const v=document.getElementById('nick').value.trim();
    if(!v){ alert('ニックネームを入力してください'); return; }
    myName=v; sessionStorage.setItem(SS_NAME, v);
    sendJoin();
  };
}
function handleHostMessage(data){
  if(!data) return;
  if(data.type==='state'){
    sub=data;
    subTimerEnds = data.phase==='select' && data.remainingMs!=null ? Date.now()+data.remainingMs
                 : data.turn ? Date.now()+data.turn.remainingMs : null;
    renderSub();
  } else if(data.type==='toast'){ showToast(data.text, 3500); if(subAns) { subAns.sent=false; renderSub(); } }
  else if(data.type==='name_taken'){
    myName=''; sessionStorage.removeItem(SS_NAME);
    renderNameForm('そのニックネームは使われています。別のニックネームにしてください');
  } else if(data.type==='removed'){
    removedByHost=true; sessionStorage.removeItem(SS_NAME); sessionStorage.removeItem(SS_PID);
    document.getElementById('app').innerHTML=`<div class="page"><div class="p-center"><h2>参加者から外れました</h2><p>もう一度参加する場合はQRコードを読み直してください。</p></div></div>`;
  }
}
function tickSubTimer(){
  const el=document.getElementById('sub-timer'); if(!el || subTimerEnds==null) return;
  const ms=Math.max(0, subTimerEnds-Date.now());
  el.textContent = ms<=0 ? '⏰ 時間です' : `残り ${Math.ceil(ms/1000)}秒`;
  el.classList.toggle('zero', ms<=5000);
}
/** 自分のポケモン。名前が全部オープンされたものは暗くして「オープン済」 */

  const cc=calledChars||[];

      else if(s.phase==='turn' && s.turn) msg=`${esc(s.turn.name)} さんの番です`;
      else if(s.phase==='reveal') msg='ホストの画面を見てください';
      else msg='ホストの画面を見てください';

        <div class="role-banner wait">${msg}</div>

    }
  }
  app.innerHTML=`<div class="page">${html}</div>`;

}
/** 自分の番：文字を選ぶプルダウン2つ（最大2つ）か、タイプを1つ。選ばれた文字・タイプは選択肢から外す */
function answerHtml(s){
  if(subAns.turnId!==s.turn.id) subAns={turnId:s.turn.id, c1:'', c2:'', type:'', sent:false};
  const chars=TABLE_CHARS.filter(c=>!s.calledChars.includes(c));
  const types=TYPES.filter(t=>!s.calledTypes.includes(t));
  const opt=(list, cur, exclude, ph)=>`<option value="">${ph}</option>`+list.filter(c=>c!==exclude).map(c=>`<option value="${esc(c)}" ${c===cur?'selected':''}>${esc(c)}</option>`).join('');
  const vals=ansVals();
  if(subAns.sent) return `<div class="p-center" style="padding:16px"><div class="spinner"></div><h3>送信しました</h3><p>ホストの画面を見てください</p></div>`;
  if(s.turn.bonus){
    // 正解したあとの追加の行動：文字を1つだけ（2つ目・タイプは選べない）
    return `<div class="ans-box">
      <div class="lbl">文字を1つ選ぶ（タイプは選べません）</div>
      <select id="a-c1">${opt(chars, subAns.c1, '', "文字を選ぶ")}</select>
      <div class="ans-pick">${vals.length?`選択中：${vals.map(v=>`<span class="v">${esc(v)}</span>`).join('')}`:'<span class="muted">まだ選んでいません</span>'}</div>
      <div class="bottom-btns"><button class="primary" data-sub="ans-submit" ${vals.length?'':'disabled'}>決定</button></div>
      <p class="muted" style="font-size:12px;text-align:center;margin:6px 0 0">決定を押さずに時間切れになると、何も選ばずに次の人へ移ります</p>
    </div>`;
  }
  return `<div class="ans-box">
      <div class="lbl">文字を選ぶ（最大2つ）</div>
      <div class="ans-sels"><select id="a-c1">${opt(chars, subAns.c1, subAns.c2, "1文字目")}</select><select id="a-c2">${opt(chars, subAns.c2, subAns.c1, "2文字目（なし）")}</select></div>
      <div class="ans-or">─ または ─</div>
      <div class="lbl">タイプを選ぶ（1つ）</div>
      <div class="tbtns">${types.map(t=>`<button data-sub="type" data-t="${esc(t)}" class="${subAns.type===t?'on':''}" style="background:${TYPE_COLORS[t]}">${esc(t)}</button>`).join('')}</div>
      <div class="ans-pick">${vals.length?`選択中：${vals.map(v=>`<span class="v">${esc(v)}</span>`).join('')}${subAns.type?' タイプ':''}`:'<span class="muted">まだ選んでいません</span>'}</div>
      <div class="bottom-btns"><button class="primary" data-sub="ans-submit" ${vals.length?'':'disabled'}>決定</button></div>
      <p class="muted" style="font-size:12px;text-align:center;margin:6px 0 0">決定を押さずに時間切れになると、何も選ばずに次の人へ移ります</p>
    </div>`;
}
function ansVals(){
  if(sub && sub.turn && sub.turn.bonus) return subAns.c1 ? [subAns.c1] : [];
  return subAns.type ? [subAns.type] : [...new Set([subAns.c1, subAns.c2].filter(Boolean))];
}
function onSubChange(e){
  if(e.target.id==='a-c1' || e.target.id==='a-c2'){
    subAns[e.target.id==='a-c1'?'c1':'c2']=e.target.value;
    if(e.target.value) subAns.type='';
    renderSub();
  }
}
function onSubClick(e){
  const pk=e.target.closest('[data-pick]');
  if(pk && sub && sub.phase==='select' && !sub.confirmed){
    const i=Number(pk.dataset.pick), arr=subPick.picks;
    if(arr.includes(i)) subPick.picks=arr.filter(x=>x!==i);
    else if(arr.length>=KEEP_N){ showToast(`${KEEP_N}匹まで選べます（外すにはもう一度タップ）`); return; }
    else subPick.picks=arr.concat(i);
    sendHost({type:'pick', gameId:sub.gameId, picks:subPick.picks, confirm:false});
    renderSub(); return;
  }
  const b=e.target.closest('[data-sub]'); if(!b || b.disabled || !sub) return;
  const act=b.dataset.sub;
  if(act==='pick-confirm'){
    if(subPick.picks.length!==KEEP_N) return;
    const gid=sub.gameId, picks=subPick.picks.slice();
    openModal(`<h3>この${KEEP_N}匹で確定しますか？</h3>
      <div class="mypk" style="margin:10px 0">${picks.map(i=>{ const pk=sub.deal[i]; return `<div class="m" style="background:#eef1f6;color:#1d1d1f"><div class="nm">${esc(pk.n)}</div><div class="types">${typeChips(pk.t)}</div></div>`; }).join('')}</div>
      <p style="font-size:13px;color:#666">確定すると変更できません</p>`, [
      {label:'やめる'},
      {label:'確定する', cls:'primary', onClick:()=>{
        if(!sub || sub.phase!=='select' || sub.gameId!==gid || sub.confirmed){ showToast('選択の時間が終わりました'); return; }
        sendHost({type:'pick', gameId:gid, picks, confirm:true});
      }}
    ]);
  }
  else if(act==='type'){
    subAns.type = subAns.type===b.dataset.t ? '' : b.dataset.t;
    if(subAns.type){ subAns.c1=''; subAns.c2=''; }
    renderSub();
  }
  else if(act==='ans-submit') confirmAnswerSub();
}
function confirmAnswerSub(){
  const s=sub; if(!s || !s.turn || !s.turn.isMe) return;
  const vals=ansVals(); if(!vals.length) return;
  const kind=subAns.type?'type':'chars';
  const turnId=s.turn.id;
  // 自分のポケモンに含まれているか
  const own=[];
  (s.mine||[]).forEach(pk=>vals.forEach(v=>{ if(pkHas(pk, kind, v)) own.push({v, n:pk.n}); }));
  const label=vals.map(v=>`「${esc(v)}」`).join('')+(kind==='type'?'タイプ':'');
  const html = own.length
    ? `<h3>本当に決定しますか？</h3><div class="warn">⚠ ${label} は<b>あなたのポケモンにも含まれています</b><br>${own.map(o=>`・「${esc(o.v)}」→ ${esc(o.n)}`).join('<br>')}<br>決定すると、あなたのポケモンもオープンされます。</div>`
    : `<h3>本当に決定しますか？</h3><p style="font-size:20px;font-weight:900">${label}</p>`;
  openModal(html, [
    {label:'やめる'},
    {label:'決定する', cls: own.length?'danger':'primary', onClick:()=>{
      if(!sub || !sub.turn || sub.turn.id!==turnId){ showToast('時間切れのため送信できませんでした'); return; }
      if(sendHost({type:'answer', turnId, kind, vals})){ subAns.sent=true; renderSub(); }
    }}
  ]);
}

    prog(80,'保存中…');

  }catch(err){ alert('保存に失敗しました'); ov.classList.remove('active'); return; }

function compressDataUrl(src, maxDim, quality){
  maxDim=maxDim||1000; quality=quality||0.8;
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>h){ if(w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;} } else { if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;} }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      resolve(c.toDataURL('image/jpeg',quality));
    };
    img.onerror=reject; img.src=src;
  });
}
function compressImageFile(file){
  return new Promise((resolve,reject)=>{ const rd=new FileReader(); rd.onload=e=>compressDataUrl(e.target.result).then(resolve,reject); rd.onerror=reject; rd.readAsDataURL(file); });
}

function attachRuleSlidesEvents(){

  container.addEventListener('click', e=>{
    const btn=e.target.closest('[data-ract]'); if(!btn || btn.disabled) return;
    const act=btn.dataset.ract;
    if(act==='slide-add'){ appData.ruleSlides.push({img:null, groups:['']}); renderRuleSlidesEditor(); return; }
    const slideCard=btn.closest('.rule-slide-card'); if(!slideCard) return;
    const si=Number(slideCard.dataset.si), slides=appData.ruleSlides, slide=slides[si];
    const groupBlock=btn.closest('.rule-group-block'), gi=groupBlock?Number(groupBlock.dataset.gi):null;
    if(act==='slide-up'){ [slides[si-1],slides[si]]=[slides[si],slides[si-1]]; renderRuleSlidesEditor(); }
    else if(act==='slide-down'){ [slides[si+1],slides[si]]=[slides[si],slides[si+1]]; renderRuleSlidesEditor(); }
    else if(act==='slide-del'){ if(confirm('このページを削除しますか？')){ slides.splice(si,1); renderRuleSlidesEditor(); } }
    else if(act==='slide-img-remove'){ slide.img=null; renderRuleSlidesEditor(); }

    else if(act==='group-up'){ [slide.groups[gi-1],slide.groups[gi]]=[slide.groups[gi],slide.groups[gi-1]]; renderRuleSlidesEditor(); }
    else if(act==='group-down'){ [slide.groups[gi+1],slide.groups[gi]]=[slide.groups[gi],slide.groups[gi+1]]; renderRuleSlidesEditor(); }
    else if(act==='group-del'){ slide.groups.splice(gi,1); renderRuleSlidesEditor(); }
    else if(act==='group-ins-above'||act==='group-ins-below'){

function wrapSelectionBig(){
  const sel=window.getSelection(); if(!sel.rangeCount) return;
  const range=sel.getRangeAt(0); if(range.collapsed) return;
  const span=document.createElement('span'); span.style.fontSize='1.5em';
  span.appendChild(range.extractContents()); range.insertNode(span);
  const parent=span.parentNode;
  if(parent && parent.classList && (parent.classList.contains('rule-red')||parent.classList.contains('rule-normal'))){
    span.classList.add(parent.classList.contains('rule-red')?'rule-red':'rule-normal');
    const others=Array.from(parent.childNodes).filter(n=>n!==span && !(n.nodeType===3 && n.textContent===''));
    if(!others.length && parent.parentNode){ parent.parentNode.insertBefore(span, parent); parent.parentNode.removeChild(parent); }
  }
}
function wrapSelectionClass(cls){
  const sel=window.getSelection(); if(!sel.rangeCount) return;
  const range=sel.getRangeAt(0); if(range.collapsed) return;
  const frag=range.extractContents();
  const strip=node=>{ if(node.nodeType===1){ if(node.classList){ node.classList.remove('rule-red','rule-normal'); if(!node.classList.length) node.removeAttribute('class'); } Array.from(node.childNodes).forEach(strip); } };
  Array.from(frag.childNodes).forEach(strip);
  const span=document.createElement('span'); span.className=cls;
  span.appendChild(frag); range.insertNode(span);
  let node=span;
  while(node.parentNode && node.parentNode.classList && (node.parentNode.classList.contains('rule-red')||node.parentNode.classList.contains('rule-normal'))){
    const parent=node.parentNode;
    if(Array.from(parent.childNodes).some(n=>n!==node && !(n.nodeType===3 && n.textContent===''))) break;
    const gp=parent.parentNode; if(!gp) break;
    gp.insertBefore(node, parent); gp.removeChild(parent);
  }
}

/* ---- 履歴・除外・使用状況・ポケモンリスト ---- */
function renderPool(){
  const items=getItemList(), keys=items.map(p=>p.n), used=getUsed(), ex=getExcluded(), hist=getHistory().slice().reverse();
  const usedCnt=keys.filter(k=>used.has(k) && !ex.has(k)).length;
  const exCnt=keys.filter(k=>ex.has(k)).length;
  const remain=keys.length-usedCnt-exCnt;
  const custom=Array.isArray(lsGet(LS.items,null));
  document.getElementById('pool-area').innerHTML=`
    <div class="card">
      <h2>勝ち負けの履歴</h2>
      <p class="muted" style="margin-top:-6px">本番のゲームだけ記録します（例題は記録しません）。全${hist.length}ゲーム</p>
      ${hist.length ? `<div class="table-wrap"><table><thead><tr><th>遊んだ日時</th><th>ゲーム</th><th>参加者</th><th>勝者</th><th>ターン数</th><th></th></tr></thead><tbody>
        ${hist.map(h=>`<tr>
          <td style="white-space:nowrap">${fmtDate(h.at)}</td>
          <td style="white-space:nowrap">${esc(h.label||'')}</td>
          <td>${esc((h.players||[]).join('、'))}</td>
          <td style="white-space:nowrap">${h.draw?`<span class="tag draw">引き分け</span> ${esc((h.winners||[]).join('、'))}`:`<span class="tag win">🏆 ${esc((h.winners||[]).join('、'))}</span>`}</td>
          <td style="white-space:nowrap">${h.turns!=null?h.turns+'回':'—'}</td>
          <td><button class="small ghost" data-act="delhist" data-id="${esc(h.id)}">削除</button></td></tr>`).join('')}
      </tbody></table></div>
      <div class="row" style="margin-top:10px"><span class="spacer"></span><button class="small danger" data-act="clearhist">履歴をすべて削除</button></div>`
      : '<p class="muted">まだ記録がありません。</p>'}
    </div>

    <div class="card">
      <h2>除外ポケモンリスト（${exCnt}件）</h2>
      <p class="muted" style="margin-top:-6px">ここにあるポケモンは配られません。「解除」で再び配られるようになります。</p>
      <div class="row" style="margin-bottom:12px">
        <input type="text" id="ex-input" list="ex-datalist" placeholder="除外したいポケモンの名前" style="max-width:320px">
        <datalist id="ex-datalist">${keys.filter(k=>!ex.has(k)).map(k=>`<option value="${esc(k)}">`).join('')}</datalist>
        <button data-act="addex">除外に追加</button>
      </div>
      ${ex.size ? `<div class="ex-list">${[...ex].map(k=>`<span class="ex-item">${esc(k)}<button class="small ghost" data-act="unex" data-k="${esc(k)}">解除</button></span>`).join('')}</div>`
                : '<p class="muted">除外しているポケモンはいません。</p>'}
    </div>

    <div class="card">
      <h2>ポケモンの使用状況</h2>
      <div class="stats4">
        <div class="stat"><div class="lbl">リスト</div><div class="val">${keys.length}</div></div>
        <div class="stat"><div class="lbl">使用済み</div><div class="val">${usedCnt}</div></div>
        <div class="stat"><div class="lbl">未使用</div><div class="val" style="color:var(--accent)">${remain}</div></div>
        <div class="stat"><div class="lbl">除外</div><div class="val">${exCnt}</div></div>
      </div>
      <p class="muted">一度配られたポケモンは、すべてのポケモンが一度ずつ配られるまで出ません（2人なら あと約${Math.floor(remain/(DEAL_N*2))}ゲーム分）。<br>
        未使用が足りなくなると、ポケモンを配る時にリセットするか確認します。</p>
      <button class="danger" data-act="resetused">使用状況をリセット</button>
    </div>

    <div class="card">
      <h2>ポケモンリスト</h2>
      <p class="muted" style="margin-top:-6px">現在：${custom?'貼り付けたリスト':'初期リスト（poke.csv）'}　${keys.length}匹</p>
      <p style="font-size:14px">リストを更新する時は、スプレッドシートの<b>A列（名前）・B列・C列（タイプ）を3列まとめてコピー</b>して下に貼り付け（CSVの中身をそのまま貼り付けてもOK）→「このリストに置き換える」を押してください。C列が空ならタイプ1つです。</p>
      <textarea id="items-input" rows="6" placeholder="名前[TAB]タイプ1[TAB]タイプ2"></textarea>
      <div class="row" style="margin-top:10px">
        <button data-act="setitems">このリストに置き換える</button>
        ${custom?'<button class="ghost" data-act="defitems">初期リストに戻す</button>':''}
      </div>
      <details style="margin-top:12px"><summary class="muted">いまのポケモンリストを見る</summary>
        <ol style="font-size:14px;line-height:1.7">${items.map(p=>`<li>${esc(p.n)} ${typeChips(p.t)}${ex.has(p.n)?' <span class="tag out">除外</span>':used.has(p.n)?' <span class="muted">（使用済み）</span>':''}</li>`).join('')}</ol></details>
    </div>

    <div class="card">
      <h2>データの引き継ぎ</h2>
      <p class="muted" style="margin-top:-6px">実施時メモ・ゲーム設定・ルール説明（画像含む）・履歴・除外・使用状況・ポケモンリストをJSONファイルで書き出し／読み込みできます（別のPCへの引き継ぎやバックアップ用）。</p>
      <div class="row">
        <button data-act="export">⬇ JSON書き出し</button>
        <button data-act="import">⬆ JSON読み込み</button>
        <input type="file" id="import-file" accept=".json,application/json" style="display:none">
      </div>
    </div>`;
  document.getElementById('import-file').onchange=onImportFile;
}
function unuseWords(entries){
  const used=getUsed();
  entries.forEach(h=>(h.words||[]).forEach(w=>used.delete(w)));
  setUsed(used);
}
function onAdminClick(e){
  const b=e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const act=b.dataset.act;
  if(act==='tohost') location.href=location.pathname;
  else if(act==='save') saveAdmin(false);
  else if(act==='save-go') saveAdmin(true);
  else if(act==='delhist'){
    if(!confirm('この履歴を削除しますか？\n（このゲームで配ったポケモンは「未使用」に戻ります）')) return;
    const all=getHistory();
    unuseWords(all.filter(h=>h.id===b.dataset.id));
    setHistory(all.filter(h=>h.id!==b.dataset.id)); renderPool();
  }
  else if(act==='clearhist'){
    if(!confirm('履歴をすべて削除しますか？（元に戻せません）\n（履歴に残っているゲームで配ったポケモンは「未使用」に戻ります）')) return;
    unuseWords(getHistory()); setHistory([]); renderPool();
  }
  else if(act==='unex'){ const s=getExcluded(); s.delete(b.dataset.k); setExcluded(s); renderPool(); }
  else if(act==='addex'){
    const v=document.getElementById('ex-input').value.trim(); if(!v) return;
    if(!getItemList().some(p=>p.n===v) && !confirm(`「${v}」はポケモンリストにありません。除外リストに追加しますか？`)) return;
    const s=getExcluded(); s.add(v); setExcluded(s); renderPool();
  }
  else if(act==='resetused'){ if(!confirm('ポケモンの使用状況をリセットしますか？\n（すべてのポケモンがまた配られるようになります。除外はそのままです）')) return; setUsed(new Set()); renderPool(); }
  else if(act==='setitems'){
    const lines=document.getElementById('items-input').value.split(/\r?\n/).filter(l=>l.trim());
    const list=[], bad=[], badChars=new Set();
    lines.forEach(l=>{
      const c=l.split(/\t|,/).map(x=>x.trim());
      const t=[c[1],c[2]].filter(Boolean);
      if(!c[0] || !t.length || t.some(x=>!TYPES.includes(x))){ bad.push(l); return; }
      [...c[0]].forEach(ch=>{ if(!TABLE_SET.has(ch)) badChars.add(ch); });
      list.push(t.length>1?[c[0],t[0],t[1]]:[c[0],t[0]]);
    });
    if(!list.length){ alert('ポケモンを読み取れませんでした。\nA列（名前）・B列・C列（タイプ）を3列まとめてコピーして貼り付けてください。'); return; }
    let msg=`${list.length}匹のポケモンリストに置き換えますか？`;
    if(bad.length) msg+=`\n\n読み取れなかった${bad.length}行は読み飛ばします（タイプが18種類にない等）：\n${bad.slice(0,5).join('\n')}${bad.length>5?'\n…':''}`;
    if(badChars.size) msg+=`\n\n文字表にない文字があります：${[...badChars].join(' ')}\n（この文字は最初からオープン扱いになります）`;
    if(!confirm(msg)) return;
    lsSet(LS.items, list); document.getElementById('items-input').value=''; renderPool();
  }
  else if(act==='defitems'){ if(!confirm(`初期リスト（${DEFAULT_ITEMS.length}匹）に戻しますか？`)) return; localStorage.removeItem(LS.items); renderPool(); }
  else if(act==='export'){
    const data={app:'pkopen', version:1, exportedAt:new Date().toISOString(), appData,
      items:lsGet(LS.items,null), used:lsGet(LS.used,[]), excluded:lsGet(LS.excluded,[]), history:lsGet(LS.history,[])};
    const blob=new Blob([JSON.stringify(data,null,1)], {type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    const d=new Date(); a.download=`pokemonopen_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  }
  else if(act==='import') document.getElementById('import-file').click();
}
function onImportFile(e){
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=async ()=>{
    try{
      const d=JSON.parse(rd.result);
      if(d.app!=='pkopen') throw new Error('format');
      if(!confirm('読み込んだデータで、今のデータ（実施時メモ・ゲーム設定・ルール説明・履歴・除外・使用状況・ポケモンリスト）を上書きしますか？')) return;
      if(d.appData) await idbSet(mergeAppData(d.appData));
      if(Array.isArray(d.items)&&d.items.length) lsSet(LS.items, d.items); else localStorage.removeItem(LS.items);
      lsSet(LS.used, Array.isArray(d.used)?d.used:[]);
      lsSet(LS.excluded, Array.isArray(d.excluded)?d.excluded:[]);
      lsSet(LS.history, Array.isArray(d.history)?d.history:[]);
      alert('読み込みました'); location.reload();
    }catch(err){ alert('このファイルは読み込めませんでした'); }
  };
  rd.readAsText(f);
  e.target.value='';
}

/* ---------- 起動 ---------- */
if(MODE==='admin') initAdmin();
else if(MODE==='sub') initSub();
else initHost();
